<script type="module">
// Premium render spike for the Steam build — SAME game geometry (CFG dims from index.html),
// four art directions, toggled in place from the bottom-right links (?theme= picks the opener):
//   noir  — glass pieces, brass-inlaid dark slate, moody (the original spike; costliest: transmission)
//   math  — graphite precision: quiet graticule, implied compass construction, ink-ceramic pieces (cheap)
//   sumo  — the ring at dusk: deep earth, broad burnished bands, urushi-lacquer pieces (cheap)
//   cosy  — fireside boardgame: tree-slice wood, cream painted lines, toy-glaze pieces (cheap)
//   alien — living membrane board with bioluminescent channels, thin-film iridescent chitin pieces
//   colossus — building-sized titans in a hazy colosseum, slow motion, telephoto from the stands
// Premium light without ray tracing: MSAA'd composer target (post-processing kills the canvas's
// own AA) + a planar mirror pass blended into the board (exact reflections — the board is flat).
// Sound is the game's own pitch+noise voice (ported tuning) with steam-grade acoustics:
// physics-driven contact clicks, cathedral reverb, loss swell + 808 thud. OFF until ♪ is clicked.
// The pieces play the menu's ambient AI battle: the game-sim section below is a verbatim port of
// index.html's engine (Piece, crossing rule, 3D contact push, turn logic) plus the landing demo's
// wobbly heuristic driver, so the tripods genuinely push each other around and off the rim,
// tumble, and start a fresh game — keep it in sync with index.html if the rules ever change.
// ?fps shows a live framerate readout. Look experiment only: not linked from the game.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---- game dims (index.html CFG — keep in sync) ----------------------------------------------
const CFG = {
  edgeU: 66.667, rings: [40, 53.3],
  sideArcs: [ { cx:-66.667, cy:0, r:40, a0:-72.542, a1:72.542 },
              { cx: 66.667, cy:0, r:40, a0:107.458, a1:252.542 } ],
  lineWidthFrac: 0.0079, padRadiusFrac: 0.0082,
  footR: 23.095, hubHeight: 23.095, legRadius: 2.0, footPadFrac: 0.4, startX: 30.597,
  // sim params (same values as index.html — the rules engine below depends on them)
  edgeEps: 0.5, maxCrossingsPerTurn: 1,
  crossEps: 0.4, holdEps: 0.45, touchEps: 0.8, lineStick: 0.25, cornerEps: 1.1,
  substepDeg: 0.4, lockDeg: 2, minMoveDeg: 2, legSegs: 12,
  inertiaK: 0.7, pushIters: 10, pushRelax: 1.0, maxPenPerIter: 0.8, minHorizFrac: 0.35,
};
CFG.footPadRadius = CFG.legRadius * CFG.footPadFrac;

let THEME = (new URLSearchParams(location.search).get('theme') || 'noir').toLowerCase();
const SHOW_FPS = new URLSearchParams(location.search).has('fps');

// ---- shared canvas helpers -------------------------------------------------------------------
// 4K displays get 4096px board maps so the printed lines stay crisp when the camera leans in;
// laptops keep 2048 (noise detail is generated at 2048 either way and upscaled — see noiseCanvas)
const S = (Math.min(screen.width, screen.height) * (devicePixelRatio || 1) >= 2000) ? 4096 : 2048;
const sc = S / (2 * CFG.edgeU), ox = S/2, oy = S/2, px = u => u * sc;
const LW = Math.max(3, px(CFG.edgeU * CFG.lineWidthFrac * 1.35));
const DOTS = [];
for (const [hx, rot] of [[-CFG.startX, 0], [CFG.startX, Math.PI]])
  for (let i = 0; i < 3; i++) {
    const th = rot + i * 2*Math.PI/3;
    DOTS.push([hx + Math.cos(th)*CFG.footR, Math.sin(th)*CFG.footR]);
  }
function canvas2d() { const cv = document.createElement('canvas'); cv.width = cv.height = S; return [cv, cv.getContext('2d')]; }
function strokeLines(c, style, width, dash) {          // the printed geometry: 2 rings + 2 lens arcs
  c.strokeStyle = style; c.lineWidth = width; c.lineCap = 'round';
  c.setLineDash(dash || []);
  for (const r of CFG.rings) { c.beginPath(); c.arc(ox, oy, px(r), 0, 7); c.stroke(); }
  for (const s of CFG.sideArcs) {
    c.beginPath(); c.arc(ox + px(s.cx), oy + px(s.cy), px(s.r), s.a0*Math.PI/180, s.a1*Math.PI/180); c.stroke();
  }
  c.setLineDash([]);
}
function noiseCanvas(amp, seed) {
  // always generated at 2048 (the per-pixel grain loop is the slow part) and upscaled to S —
  // the noise is low-frequency mood, the crispness lives in the vector linework drawn at S
  const NS = 2048;
  const cv = document.createElement('canvas'); cv.width = cv.height = NS;
  const c = cv.getContext('2d');
  c.fillStyle = '#808080'; c.fillRect(0, 0, NS, NS);
  let rng = seed || 1234567;
  const rnd = () => (rng = (rng * 16807) % 2147483647) / 2147483647;
  for (let pass = 0; pass < 3; pass++) {
    const n = 42 * (pass + 1), r0 = NS / (5 + pass * 6);
    for (let i = 0; i < n; i++) {
      const x = rnd()*NS, y = rnd()*NS, r = r0 * (0.5 + rnd()), v = rnd();
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${v>0.5?255:0},${v>0.5?255:0},${v>0.5?255:0},${amp/(pass+1)})`);
      g.addColorStop(1, 'rgba(128,128,128,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    }
  }
  const img = c.getImageData(0, 0, NS, NS), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const g = (rnd()-0.5)*22; d[i]+=g; d[i+1]+=g; d[i+2]+=g; }
  c.putImageData(img, 0, 0);
  if (S === NS) return cv;
  const up = document.createElement('canvas'); up.width = up.height = S;
  up.getContext('2d').drawImage(cv, 0, 0, S, S);
  return up;
}
function vignette(c, strength) {
  const vg = c.createRadialGradient(ox, oy, px(CFG.edgeU)*0.35, ox, oy, px(CFG.edgeU));
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${strength})`);
  c.fillStyle = vg; c.fillRect(0, 0, S, S);
}
const tex  = cv => { const t = new THREE.CanvasTexture(cv); t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace; return t; };
const texL = cv => { const t = new THREE.CanvasTexture(cv); t.anisotropy = 8; return t; };

// ---- themes ----------------------------------------------------------------------------------
const THEMES = {

  // ============ NOIR — glass on brass-inlaid slate (the original spike) ============
  noir: {
    bg: 0x0a0c10, exposure: 1.05, bloom: [0.22, 0.5, 0.9],
    key: { color: 0xfff1dc, intensity: 2.6, pos: [70,130,45], shadow: 0.55 },
    fill:{ color: 0x8fb4ff, intensity: 0.5 },
    band: { color: 0x353a42, rough: 0.35, metal: 0.85 }, slabColor: 0x17191d, tableColor: 0x0d0f13,
    boardEnv: 0.7, bumpScale: 0.9, boardReflect: 0.34, guide: 0xf3e3c0,
    paint() {
      const [al, a] = canvas2d();
      a.fillStyle = '#23262c'; a.fillRect(0, 0, S, S);
      a.globalCompositeOperation = 'soft-light'; a.globalAlpha = 0.85;
      a.drawImage(noiseCanvas(0.12), 0, 0);
      a.globalCompositeOperation = 'source-over'; a.globalAlpha = 1;
      vignette(a, 0.34);
      strokeLines(a, 'rgba(0,0,0,0.55)', LW*1.9);
      const brass = a.createLinearGradient(0, 0, S, S);
      brass.addColorStop(0,'#a8843c'); brass.addColorStop(0.5,'#d6b567'); brass.addColorStop(1,'#a8843c');
      strokeLines(a, brass, LW);
      const dotR = Math.max(3, px(CFG.edgeU * CFG.padRadiusFrac * 1.6));
      for (const [dx,dy] of DOTS) {
        a.fillStyle='rgba(0,0,0,0.5)'; a.beginPath(); a.arc(ox+px(dx), oy+px(dy)+dotR*0.35, dotR*1.25, 0, 7); a.fill();
        a.fillStyle=brass; a.beginPath(); a.arc(ox+px(dx), oy+px(dy), dotR, 0, 7); a.fill();
      }
      const [ro, r] = canvas2d();
      r.fillStyle='#9a9a9a'; r.fillRect(0,0,S,S);
      r.globalAlpha=0.5; r.drawImage(noiseCanvas(0.12, 777), 0, 0); r.globalAlpha=1;
      strokeLines(r, '#3a3a3a', LW);
      for (const [dx,dy] of DOTS) { r.fillStyle='#3a3a3a'; r.beginPath(); r.arc(ox+px(dx), oy+px(dy), dotR, 0, 7); r.fill(); }
      const [bu, b] = canvas2d();
      b.fillStyle='#808080'; b.fillRect(0,0,S,S);
      b.globalAlpha=0.6; b.drawImage(noiseCanvas(0.10, 999), 0, 0); b.globalAlpha=1;
      strokeLines(b, '#5a5a5a', LW*1.6);
      return { albedo: al, rough: ro, bump: bu };
    },
    pieces(which) {   // glass — transmission (the expensive material; this theme is the GPU test)
      const c = which === 'blue' ? { tint:0x7aa4ee, att:0x3b74e8 } : { tint:0xee7a6f, att:0xe8483b };
      const mk = o => new THREE.MeshPhysicalMaterial(Object.assign({
        color: c.tint, metalness: 0, transmission: 1.0, ior: 1.5,
        attenuationColor: new THREE.Color(c.att), emissive: new THREE.Color(c.att),
      }, o));
      return {
        // legs at grazing angles are all Fresnel: with full clearcoat/env they washed to colourless
        // chrome (phone photo) — so the legs run the attenuation much harder and the reflective
        // terms much softer, and you see INTO the glass the way you do on the face-on bead.
        leg: mk({ thickness: 11.0, attenuationDistance: 2.4, roughness: 0.12, emissiveIntensity: 0.24,
                  clearcoat: 0.45, clearcoatRoughness: 0.14, specularIntensity: 0.4, envMapIntensity: 0.3 }),
        // the bead — untouched, it reads as real glass
        hub: mk({ thickness: 5.0, attenuationDistance: 6.5, roughness: 0.12, emissiveIntensity: 0.06,
                  clearcoat: 1.0, clearcoatRoughness: 0.06, specularIntensity: 0.9, envMapIntensity: 0.8 }),
      };
    },
  },

  // ============ MATH — graphite precision: the geometry speaks for itself, nothing is written ============
  math: {
    bg: 0x0d1017, exposure: 1.0, bloom: [0.16, 0.45, 0.88],
    key: { color: 0xffffff, intensity: 2.2, pos: [40,140,70], shadow: 0.5 },
    fill:{ color: 0xa8c8ff, intensity: 0.65 },
    band: { color: 0x20242c, rough: 0.5, metal: 0.6 }, slabColor: 0x14171d, tableColor: 0x0b0d12,
    boardEnv: 0.3, bumpScale: 0.35, boardReflect: 0.16, guide: 0xdcecff,
    paint() {
      // Pure COMPASS work, no straightedge. Every board curve is drawn as a FULL circle, but the
      // ink is nearly invisible along empty stretches and DARKENS as it approaches a point where
      // two circles cross — so the whole figure reads as a constellation of intersections, the
      // geometry lit only where curves actually meet.
      const [al, a] = canvas2d();
      a.fillStyle = '#111826'; a.fillRect(0, 0, S, S);          // dark drafting-paper blue
      a.globalAlpha = 0.2; a.drawImage(noiseCanvas(0.06), 0, 0); a.globalAlpha = 1;
      const circles = [
        { cx: 0, cy: 0, r: CFG.rings[0], ring: true },
        { cx: 0, cy: 0, r: CFG.rings[1], ring: true },
        ...CFG.sideArcs.map(s => ({ cx: s.cx, cy: s.cy, r: s.r, ring: false })),
      ];
      // every pairwise circle-circle intersection point (full circles, spans ignored)
      const X = [];
      for (let i = 0; i < circles.length; i++) for (let j = i+1; j < circles.length; j++) {
        const A = circles[i], B = circles[j];
        const dx = B.cx - A.cx, dy = B.cy - A.cy, d = Math.hypot(dx, dy);
        if (d < 1e-6 || d > A.r + B.r || d < Math.abs(A.r - B.r)) continue;
        const xx = (d*d + A.r*A.r - B.r*B.r)/(2*d), yy2 = A.r*A.r - xx*xx;
        if (yy2 < 0) continue;
        const yy = Math.sqrt(yy2), ux = dx/d, uy = dy/d;
        for (const sgn of [1, -1]) X.push({ x: A.cx + xx*ux - sgn*yy*uy, y: A.cy + xx*uy + sgn*yy*ux });
      }
      const nearX = (x, y) => {                                 // board-unit distance to the closest crossing
        let m = 1e9;
        for (const p of X) { const dd = Math.hypot(x - p.x, y - p.y); if (dd < m) m = dd; }
        return m;
      };
      const HOT = 3, COLD = 15;                                 // bright within HOT u, faded out by COLD u
      // draw each circle as many short segments, alpha & width ramping up toward crossings
      for (const c of circles) {
        const [cxp, cyp] = [ox + px(c.cx), oy + px(c.cy)];
        const steps = 900;
        let prev = null;
        for (let k = 0; k <= steps; k++) {
          const th = k/steps*Math.PI*2;
          const wx = c.cx + Math.cos(th)*c.r, wy = c.cy + Math.sin(th)*c.r;
          const cur = [cxp + Math.cos(th)*px(c.r), cyp + Math.sin(th)*px(c.r)];
          if (prev) {
            const t = Math.max(0, Math.min(1, (COLD - nearX(wx, wy)) / (COLD - HOT)));
            const s = t*t*(3 - 2*t);                            // smoothstep emphasis
            const floor = c.ring ? 0.05 : 0.02;                 // rings keep a faint readable floor
            const alpha = floor + (0.92 - floor)*s;
            a.strokeStyle = `rgba(226,240,255,${alpha.toFixed(3)})`;
            a.lineWidth = LW*(0.55 + 0.9*s);
            a.lineCap = 'round';
            a.beginPath(); a.moveTo(prev[0], prev[1]); a.lineTo(cur[0], cur[1]); a.stroke();
          }
          prev = cur;
        }
      }
      // a bright node dot right at each crossing
      for (const p of X) {
        a.fillStyle = 'rgba(232,244,255,0.95)';
        a.beginPath(); a.arc(ox + px(p.x), oy + px(p.y), Math.max(3, LW*0.9), 0, 7); a.fill();
      }
      // faint compass-centre pricks (points, not lines)
      for (const c of circles) {
        a.fillStyle = 'rgba(150,192,236,0.22)';
        a.beginPath(); a.arc(ox + px(c.cx), oy + px(c.cy), 3, 0, 7); a.fill();
      }
      vignette(a, 0.22);
      // start dots as marked points
      const dotR = Math.max(4, px(CFG.edgeU * CFG.padRadiusFrac * 1.9));
      for (const [dx,dy] of DOTS) {
        a.strokeStyle = 'rgba(226,240,255,0.85)'; a.lineWidth = 3;
        a.beginPath(); a.arc(ox+px(dx), oy+px(dy), dotR, 0, 7); a.stroke();
      }
      // rough/bump: draw the full circles uniformly so the relief roughly follows the ink
      const drawCircles = (c2, style, wid) => {
        c2.strokeStyle = style; c2.lineWidth = wid; c2.lineCap = 'round';
        for (const c of circles) { c2.beginPath(); c2.arc(ox + px(c.cx), oy + px(c.cy), px(c.r), 0, 7); c2.stroke(); }
      };
      const [ro, r] = canvas2d();
      r.fillStyle = '#8a8a8a'; r.fillRect(0, 0, S, S);          // matte paper
      drawCircles(r, '#5c5c5c', LW*0.7);
      const [bu, b] = canvas2d(); b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
      drawCircles(b, '#8c8c8c', LW*0.7);                        // ink raised a hair
      return { albedo: al, rough: ro, bump: bu };
    },
    pieces(which) {   // glazed ink ceramic — cheap, phone-friendly
      const col = which === 'blue' ? 0x2f6fd8 : 0xd8442f;
      // hubs face the camera so gloss reads as glaze; legs sit at grazing angles where
      // Fresnel would silver them — they get a duller, lower-spec variant of the same glaze
      const hub = new THREE.MeshPhysicalMaterial({ color: col, metalness: 0, roughness: 0.45,
        clearcoat: 0.35, clearcoatRoughness: 0.3, envMapIntensity: 0.45 });
      const leg = new THREE.MeshPhysicalMaterial({ color: col, metalness: 0, roughness: 0.52,
        clearcoat: 0.15, clearcoatRoughness: 0.4, envMapIntensity: 0.25, specularIntensity: 0.45 });
      return { leg, hub };
    },
  },

  // ============ SUMO — the ring at dusk: weight and ceremony, no props ============
  sumo: {
    bg: 0x17120d, exposure: 1.02, bloom: [0.15, 0.55, 0.92],
    key: { color: 0xffdfae, intensity: 2.4, pos: [95,85,30], shadow: 0.65 },
    fill:{ color: 0x7286a8, intensity: 0.35 },
    band: { color: 0x3a2b1c, rough: 0.7, metal: 0.05 }, slabColor: 0x46351f, tableColor: 0x201810,
    boardEnv: 0.4, bumpScale: 0.9, boardReflect: 0.05, guide: 0xf6dfae,
    paint() {
      const [al, a] = canvas2d();
      a.fillStyle = '#6e4a2c'; a.fillRect(0, 0, S, S);          // deep earth
      a.globalCompositeOperation = 'soft-light'; a.globalAlpha = 1;
      a.drawImage(noiseCanvas(0.14), 0, 0);
      a.globalCompositeOperation = 'source-over';
      // faint worn patches — the ring has been fought on
      let rng = 424242; const rnd = () => (rng = (rng*16807)%2147483647)/2147483647;
      for (let i = 0; i < 40; i++) {
        const x = rnd()*S, y = rnd()*S, r = 40 + rnd()*140;
        const g = a.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(46,30,16,${0.04 + rnd()*0.05})`); g.addColorStop(1, 'rgba(46,30,16,0)');
        a.fillStyle = g; a.beginPath(); a.arc(x, y, r, 0, 7); a.fill();
      }
      vignette(a, 0.42);
      // the lines as broad, calm bands of burnished sand — weight, not rope
      strokeLines(a, 'rgba(28,16,6,0.55)', LW*2.6);
      strokeLines(a, '#c89a54', LW*1.8);
      strokeLines(a, 'rgba(240,206,138,0.5)', LW*0.7);
      // start dots: plain warm marks
      const dotR = Math.max(5, px(CFG.edgeU * CFG.padRadiusFrac * 2.0));
      for (const [dx,dy] of DOTS) {
        a.fillStyle = 'rgba(28,16,6,0.45)'; a.beginPath(); a.arc(ox+px(dx), oy+px(dy)+dotR*0.3, dotR*1.25, 0, 7); a.fill();
        a.fillStyle = '#d9ae62'; a.beginPath(); a.arc(ox+px(dx), oy+px(dy), dotR, 0, 7); a.fill();
      }
      const [ro, r] = canvas2d();
      r.fillStyle = '#b0b0b0'; r.fillRect(0, 0, S, S);           // dry earth = rough
      r.globalAlpha = 0.4; r.drawImage(noiseCanvas(0.12, 555), 0, 0); r.globalAlpha = 1;
      strokeLines(r, '#7a7a7a', LW*1.8);                          // burnished bands sit glossier
      const [bu, b] = canvas2d();
      b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
      b.globalAlpha = 0.6; b.drawImage(noiseCanvas(0.12, 313), 0, 0); b.globalAlpha = 1;
      strokeLines(b, '#b4b4b4', LW*1.8);                          // bands gently raised
      return { albedo: al, rough: ro, bump: bu };
    },
    pieces(which) {   // urushi lacquer — deep indigo / vermillion, gold-warm sheen
      // deep lacquer only works face-on (the hubs); on thin grazing legs the dark diffuse
      // vanishes under Fresnel and they chrome out — legs use a lighter coat, less spec
      const hubCol = which === 'blue' ? 0x1d2854 : 0x8c1c12;
      const legCol = which === 'blue' ? 0x31488f : 0xb03220;
      const hub = new THREE.MeshPhysicalMaterial({ color: hubCol, metalness: 0, roughness: 0.3,
        clearcoat: 0.55, clearcoatRoughness: 0.18, envMapIntensity: 0.5 });
      const leg = new THREE.MeshPhysicalMaterial({ color: legCol, metalness: 0, roughness: 0.42,
        clearcoat: 0.22, clearcoatRoughness: 0.32, envMapIntensity: 0.2, specularIntensity: 0.5 });
      return { leg, hub };
    },
  },

  // ============ COSY — heirloom board: figured walnut + gilt inlay, satin-waxed ============
  // An expensive antique games table, not a kids' toy: deep figured walnut cut across the log,
  // the lines as thin brass/gilt marquetry inlay, a satin wax finish (not plastic gloss), and
  // turned rosewood pieces capped in aged brass.
  cosy: {
    bg: 0x1a120c, exposure: 1.04, bloom: [0.14, 0.5, 0.9],
    key: { color: 0xffcf96, intensity: 2.5, pos: [95,80,30], shadow: 0.6 },
    fill:{ color: 0x8a94b0, intensity: 0.28 },
    band: { color: 0x3a2716, rough: 0.4, metal: 0.15 }, slabColor: 0x2e1f12, tableColor: 0x241811,
    boardEnv: 0.55, bumpScale: 0.5, boardReflect: 0.16, guide: 0xe8cf9a,
    paint() {
      const [al, a] = canvas2d();
      a.fillStyle = '#4a3220'; a.fillRect(0, 0, S, S);           // dark walnut ground
      // figured walnut cut across the log: tight, richly coloured growth rings around an off-centre
      // heart, deep browns to warm amber — the crowded rings near the heart are the "figure"
      let rng = 9090909; const rnd = () => (rng = (rng*16807)%2147483647)/2147483647;
      const hx = ox + S*0.09, hy = oy - S*0.06;
      const wob = [];
      for (let k = 0; k < 5; k++) wob.push({ f: 2 + Math.floor(rnd()*5), ph: rnd()*7, amp: 0.010 + rnd()*0.022 });
      let ring = S*0.01;
      while (ring < S*0.82) {
        const dark = rnd() > 0.4, w = dark ? 2.5 + rnd()*5 : 1 + rnd()*2;
        // amber highs, near-black-brown lows — the chroma range antique walnut has, honey oak doesn't
        a.strokeStyle = dark ? `rgba(58,34,16,${0.22 + rnd()*0.18})` : `rgba(150,102,52,${0.10 + rnd()*0.12})`;
        a.lineWidth = w; a.beginPath();
        for (let t = 0; t <= 160; t++) {
          const th = t/160*Math.PI*2;
          let rr = ring;
          for (const h of wob) rr *= 1 + h.amp*Math.sin(h.f*th + h.ph + ring*0.0014);
          const x2 = hx + Math.cos(th)*rr, y2 = hy + Math.sin(th)*rr;
          t ? a.lineTo(x2, y2) : a.moveTo(x2, y2);
        }
        a.closePath(); a.stroke();
        ring += S*(0.004 + rnd()*0.010);                         // tighter spacing = finer, dearer figure
      }
      for (let i = 0; i < 55; i++) {                             // fine medullary rays / silvering
        const th = rnd()*Math.PI*2, r0 = S*(0.02 + rnd()*0.12), r1 = r0 + S*(0.08 + rnd()*0.4);
        a.strokeStyle = `rgba(176,132,74,${0.04 + rnd()*0.06})`; a.lineWidth = 1 + rnd()*2;
        a.beginPath(); a.moveTo(hx + Math.cos(th)*r0, hy + Math.sin(th)*r0);
        a.lineTo(hx + Math.cos(th)*r1, hy + Math.sin(th)*r1); a.stroke();
      }
      a.globalCompositeOperation = 'soft-light'; a.globalAlpha = 0.45;
      a.drawImage(noiseCanvas(0.07, 202), 0, 0);
      a.globalCompositeOperation = 'overlay'; a.globalAlpha = 0.3;   // warm waxed sheen pooling at centre
      const wax = a.createRadialGradient(ox, oy, 0, ox, oy, px(CFG.edgeU));
      wax.addColorStop(0, 'rgba(120,84,40,0.5)'); wax.addColorStop(1, 'rgba(0,0,0,0)');
      a.fillStyle = wax; a.beginPath(); a.arc(ox, oy, px(CFG.edgeU), 0, 7); a.fill();
      a.globalCompositeOperation = 'source-over'; a.globalAlpha = 1;
      vignette(a, 0.34);
      // the lines as inlaid brass/gilt marquetry: a dark shadow channel, then a thin bright metal line
      strokeLines(a, 'rgba(24,14,6,0.6)', LW*1.5);
      const gilt = a.createLinearGradient(0, 0, S, S);
      gilt.addColorStop(0, '#b78a44'); gilt.addColorStop(0.5, '#e8c778'); gilt.addColorStop(1, '#b78a44');
      strokeLines(a, gilt, LW*0.8);
      const dotR = Math.max(4, px(CFG.edgeU * CFG.padRadiusFrac * 1.7));
      for (const [dx,dy] of DOTS) {                              // inlaid brass studs
        a.fillStyle = 'rgba(24,14,6,0.55)'; a.beginPath(); a.arc(ox+px(dx), oy+px(dy)+dotR*0.3, dotR*1.15, 0, 7); a.fill();
        a.fillStyle = gilt; a.beginPath(); a.arc(ox+px(dx), oy+px(dy), dotR, 0, 7); a.fill();
      }
      const [ro, r] = canvas2d();
      r.fillStyle = '#7a7a7a'; r.fillRect(0, 0, S, S);           // satin wax: soft mid gloss, not lacquer
      r.globalAlpha = 0.3; r.drawImage(noiseCanvas(0.09, 404), 0, 0); r.globalAlpha = 1;
      strokeLines(r, '#4a4a4a', LW*0.8);                          // polished brass inlay reads shinier
      const [bu, b] = canvas2d();
      b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
      b.globalAlpha = 0.35; b.drawImage(noiseCanvas(0.07, 505), 0, 0); b.globalAlpha = 1;
      strokeLines(b, '#6a6a6a', LW*0.9);                          // inlay set slightly INTO the wood
      return { albedo: al, rough: ro, bump: bu };
    },
    pieces(which) {   // turned hardwood capped in aged brass — an heirloom set
      const wood = which === 'blue' ? 0x3a4a66 : 0x5e2a22;       // stained rosewood, blue/red tinted
      const brass = 0x9a7638;
      const hub = new THREE.MeshPhysicalMaterial({ color: brass, metalness: 0.75, roughness: 0.42,
        clearcoat: 0.3, clearcoatRoughness: 0.4, envMapIntensity: 0.55 });   // aged brass bead
      const leg = new THREE.MeshPhysicalMaterial({ color: wood, metalness: 0, roughness: 0.44,
        clearcoat: 0.35, clearcoatRoughness: 0.25, envMapIntensity: 0.3, specularIntensity: 0.6 });  // waxed wood
      return { leg, hub };
    },
  },

  // ============ ALIEN — foreign biology: the board is alive, the light is wrong ============
  // No little-green-men skin. The board is a subdermal membrane with a branching vein network,
  // and the printed geometry is BIOLUMINESCENT — the game lines are channels the organism lights
  // from inside (emissive map + bloom). The pieces are thin-film iridescent chitin: reflection
  // colour genuinely shifts with viewing angle (physical thin-film interference, the "weird
  // refractive index" of beetle shells and oil slicks) — strongest exactly at the grazing angles
  // that silver ordinary materials. Lighting is deliberately unnatural: a dim violet key from
  // the wrong side, an acid-teal counter light, and murk instead of air.
  alien: {
    bg: 0x04060b, exposure: 1.05, bloom: [0.45, 0.7, 0.72],
    key: { color: 0x9d8ce8, intensity: 1.0, pos: [-70,110,-50], shadow: 0.35 },
    fill:{ color: 0x35e8c8, intensity: 0.55 },
    band: { color: 0x191324, rough: 0.35, metal: 0.25 }, slabColor: 0x110d1a, tableColor: 0x06060c,
    boardEnv: 0.25, bumpScale: 1.1, emissiveIntensity: 1.5, boardReflect: 0.28, guide: 0x8dffe8,
    fog: { color: 0x0a0816, density: 0.0018 },
    paint() {
      // one vein network, drawn into albedo (dark), bump (raised) — precompute the segments
      let rng = 777001; const rnd = () => (rng = (rng*16807)%2147483647)/2147483647;
      const segs = [], stack = [];
      for (let i = 0; i < 24; i++)
        stack.push({ x: rnd()*S, y: rnd()*S, h: rnd()*Math.PI*2, w: 4 + rnd()*5, life: 50 + rnd()*90 });
      while (stack.length) {
        const v = stack.pop();
        while (v.life-- > 0 && v.w > 0.8) {
          const x0 = v.x, y0 = v.y;
          v.h += (rnd() - 0.5)*0.55;
          v.x += Math.cos(v.h)*9; v.y += Math.sin(v.h)*9;
          v.w *= 0.985;
          segs.push([x0, y0, v.x, v.y, v.w]);
          if (rnd() < 0.05 && stack.length < 100)
            stack.push({ x: v.x, y: v.y, h: v.h + (rnd() < 0.5 ? 0.9 : -0.9), w: v.w*0.7, life: v.life*0.7 });
        }
      }
      const drawVeins = (c, style, wMul) => {
        c.strokeStyle = style; c.lineCap = 'round';
        for (const [x0, y0, x1, y1, w] of segs) {
          c.lineWidth = Math.max(0.6, w*wMul);
          c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
        }
      };
      const [al, a] = canvas2d();
      a.fillStyle = '#171226'; a.fillRect(0, 0, S, S);          // midnight flesh
      // subdermal blotches — violet and abyssal teal
      for (let i = 0; i < 70; i++) {
        const x = rnd()*S, y = rnd()*S, r = 40 + rnd()*160, teal = rnd() > 0.6;
        const g = a.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, teal ? `rgba(16,58,66,${0.06 + rnd()*0.08})` : `rgba(58,30,88,${0.05 + rnd()*0.08})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        a.fillStyle = g; a.beginPath(); a.arc(x, y, r, 0, 7); a.fill();
      }
      a.globalCompositeOperation = 'soft-light'; a.globalAlpha = 0.7;
      a.drawImage(noiseCanvas(0.12, 909), 0, 0);
      a.globalCompositeOperation = 'source-over'; a.globalAlpha = 1;
      drawVeins(a, 'rgba(20,10,32,0.55)', 1);
      vignette(a, 0.44);
      // the printed geometry sits dark in the albedo — the light comes from the emissive channels
      strokeLines(a, 'rgba(6,16,16,0.8)', LW*1.7);
      strokeLines(a, '#0e3c36', LW);
      const dotR = Math.max(4, px(CFG.edgeU * CFG.padRadiusFrac * 2.0));
      for (const [dx,dy] of DOTS) {
        a.strokeStyle = '#12433c'; a.lineWidth = 3;
        a.beginPath(); a.arc(ox+px(dx), oy+px(dy), dotR, 0, 7); a.stroke();
      }
      const [ro, r] = canvas2d();
      r.fillStyle = '#4a4a4a'; r.fillRect(0, 0, S, S);          // moist membrane = glossy
      r.globalAlpha = 0.5; r.drawImage(noiseCanvas(0.14, 606), 0, 0); r.globalAlpha = 1;
      drawVeins(r, '#5c5c5c', 1);
      strokeLines(r, '#303030', LW);                             // wet channels, glossier still
      const [bu, b] = canvas2d();
      b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
      b.globalAlpha = 0.5; b.drawImage(noiseCanvas(0.10, 505), 0, 0); b.globalAlpha = 1;
      drawVeins(b, '#9c9c9c', 1);                                // veins sit proud of the membrane
      strokeLines(b, '#5a5a5a', LW*1.4);                         // channels recessed
      // emissive: the organism lights its own geometry — layered halo + hot core
      const [em, e] = canvas2d();
      e.fillStyle = '#000000'; e.fillRect(0, 0, S, S);
      strokeLines(e, 'rgba(38,150,128,0.10)', LW*5);
      strokeLines(e, 'rgba(52,208,178,0.22)', LW*3);
      strokeLines(e, 'rgba(96,246,214,0.5)', LW*1.6);
      strokeLines(e, '#b8ffe9', LW*0.7);
      for (const [dx,dy] of DOTS) {                              // photophore pores at the start dots
        const g = e.createRadialGradient(ox+px(dx), oy+px(dy), 0, ox+px(dx), oy+px(dy), dotR*2.2);
        g.addColorStop(0, 'rgba(196,255,238,0.95)'); g.addColorStop(0.4, 'rgba(96,246,214,0.5)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        e.fillStyle = g; e.beginPath(); e.arc(ox+px(dx), oy+px(dy), dotR*2.2, 0, 7); e.fill();
      }
      return { albedo: al, rough: ro, bump: bu, emissive: em };
    },
    pieces(which) {   // thin-film iridescent chitin with a faint internal glow
      const base = which === 'blue' ? 0x24558c : 0x7c2030;      // petrol / haem — bright enough to read
      const film = which === 'blue' ? [140, 520] : [240, 700];  // nm range picks each side's shimmer
      const mk = o => new THREE.MeshPhysicalMaterial(Object.assign({
        color: base, metalness: 0, iridescence: 1.0, iridescenceIOR: 1.8,
        iridescenceThicknessRange: film, emissive: new THREE.Color(base),
      }, o));
      return {
        hub: mk({ roughness: 0.18, clearcoat: 1.0, clearcoatRoughness: 0.1, emissiveIntensity: 0.22,
                  envMapIntensity: 0.7, specularIntensity: 0.8 }),
        // legs: PARTIAL thin-film only — at true grazing angles full iridescence goes white in
        // every wavelength (it replaces Fresnel entirely), so the legs run half-strength shimmer
        // over waxy chitin, rough enough to diffuse the sheath, with a stronger internal glow
        leg: mk({ iridescence: 0.45, roughness: 0.44, clearcoat: 0.2, clearcoatRoughness: 0.35,
                  emissiveIntensity: 0.3, envMapIntensity: 0.15, specularIntensity: 0.35 }),
      };
    },
  },

  // ============ COLOSSUS — two titans the size of buildings, seen from the upper seats ============
  // Enormity is all cues, not size: heavy atmospheric haze (far things fade = far things are FAR),
  // a telephoto camera high in the stands (long lens compresses = monumental), slow motion
  // (giant things move slowly — the whole sim runs at a third speed), crowd-speckled tiers for
  // scale reference, and dust hanging in the sun.
  colossus: {
    bg: 0xb9a888, exposure: 1.0, bloom: [0.12, 0.4, 0.95],
    fill:{ color: 0x9fb4d8, intensity: 0.25 },
    band: { color: 0x8a7a5e, rough: 0.95, metal: 0.0 }, slabColor: 0x7e6f54, tableColor: 0xa08b64,
    boardEnv: 0.2, bumpScale: 1.2, boardReflect: 0, guide: 0xff9c3a,
    fog: { color: 0xc6b593, density: 0.0016 },   // haze GRADES with distance — board clear, wall half-gone
    // a LOW raking sun casts long dramatic shadows across the sand — nothing says "enormous" like
    // a shadow that stretches half the arena; camera high in the far seats looking down and across
    key: { color: 0xffe0b0, intensity: 3.4, pos: [230,90,120], shadow: 0.9 },
    cam: { pos: [-150, 115, 300], target: [0, 22, 0], fov: 34 },
    simSpeed: 0.35,
    paint() {
      const [al, a] = canvas2d();
      a.fillStyle = '#b49b6d'; a.fillRect(0, 0, S, S);           // raked arena sand
      a.globalCompositeOperation = 'soft-light'; a.globalAlpha = 1;
      a.drawImage(noiseCanvas(0.15, 111), 0, 0);
      a.globalCompositeOperation = 'source-over';
      let rng = 606060; const rnd = () => (rng = (rng*16807)%2147483647)/2147483647;
      for (let i = 0; i < 50; i++) {                             // churned patches from the last bout
        const x = rnd()*S, y = rnd()*S, r = 40 + rnd()*160;
        const g = a.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(122,100,64,${0.05 + rnd()*0.07})`); g.addColorStop(1, 'rgba(122,100,64,0)');
        a.fillStyle = g; a.beginPath(); a.arc(x, y, r, 0, 7); a.fill();
      }
      vignette(a, 0.3);
      // the lines as ancient basalt inlay set into the sand
      strokeLines(a, 'rgba(40,32,22,0.5)', LW*2.4);
      strokeLines(a, '#4a4038', LW*1.7);
      strokeLines(a, 'rgba(150,138,120,0.35)', LW*0.5);          // worn top sheen
      const dotR = Math.max(5, px(CFG.edgeU * CFG.padRadiusFrac * 2.2));
      for (const [dx,dy] of DOTS) {
        a.fillStyle = 'rgba(40,32,22,0.5)'; a.beginPath(); a.arc(ox+px(dx), oy+px(dy)+dotR*0.3, dotR*1.3, 0, 7); a.fill();
        a.fillStyle = '#4a4038'; a.beginPath(); a.arc(ox+px(dx), oy+px(dy), dotR, 0, 7); a.fill();
      }
      const [ro, r] = canvas2d();
      r.fillStyle = '#c2c2c2'; r.fillRect(0, 0, S, S);           // dry sand: fully matte
      r.globalAlpha = 0.35; r.drawImage(noiseCanvas(0.12, 222), 0, 0); r.globalAlpha = 1;
      strokeLines(r, '#8a8a8a', LW*1.7);                          // stone slightly less matte
      const [bu, b] = canvas2d();
      b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
      b.globalAlpha = 0.7; b.drawImage(noiseCanvas(0.14, 333), 0, 0); b.globalAlpha = 1;
      strokeLines(b, '#565656', LW*1.7);                          // inlay recessed into the sand
      return { albedo: al, rough: ro, bump: bu };
    },
    pieces(which) {   // colossal carved STONE — not bronze figurines. Matte, unlit-looking rock with
      // flat-shaded facets (the tube's segments become chisel planes) reads as roughly-hewn granite;
      // a low env and no metalness kills the "small shiny figurine" tell entirely. Weathered pale
      // stone with a faint mineral tint carrying the blue/red identity.
      const stone = which === 'blue' ? 0x8f97a0 : 0xa8907e;   // bluish granite / warm sandstone
      const mk = () => new THREE.MeshStandardMaterial({ color: stone, metalness: 0, roughness: 0.95,
        envMapIntensity: 0.12, flatShading: true });
      return { leg: mk(), hub: mk() };
    },
    env() {   // the colosseum: tiered stands flecked with crowd, an arched outer wall, hanging dust
      const g = new THREE.Group();
      // crowd texture: rows of tiny multicoloured specks on stone — individual people at this
      // distance are two pixels wide, which is exactly what sells the size of everything else
      // person-scale specks: at these radii a spectator is ~2 units tall — big enough to read as
      // a crowd, small enough that every one of them shouts how big the arena is
      const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 256;
      const c = cv.getContext('2d');
      c.fillStyle = '#867457'; c.fillRect(0, 0, 1024, 256);
      let rng = 121212; const rnd = () => (rng = (rng*16807)%2147483647)/2147483647;
      const hues = ['#5a4a38','#8a5b36','#4a4a52','#96826a','#3e3a34','#a8906c','#7a4438','#4e5c6a','#6d5347'];
      for (let x = 4 + rnd()*6; x < 1024; x += 9 + rnd()*8)
        if (rnd() > 0.18) {
          c.fillStyle = hues[Math.floor(rnd()*hues.length)];
          const h = 90 + rnd()*50;
          c.fillRect(x, 250 - h, 5 + rnd()*3, h);                      // body
          c.fillStyle = '#c9a882';
          c.beginPath(); c.arc(x + 3.5, 246 - h, 4.5, 0, 7); c.fill(); // head
        }
      const crowdTex = new THREE.CanvasTexture(cv);
      crowdTex.wrapS = THREE.RepeatWrapping; crowdTex.repeat.set(24, 1); crowdTex.anisotropy = 8;
      crowdTex.colorSpace = THREE.SRGBColorSpace;
      // stepped seating, seen from INSIDE the bowl: a vertical riser faced with crowd, then a
      // flat stone walkway — the step profile is what reads as architecture instead of wallpaper
      const crowdMat = new THREE.MeshStandardMaterial({ map: crowdTex, roughness: 0.95, side: THREE.DoubleSide });
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x9a8a6a, roughness: 0.95, side: THREE.DoubleSide });
      for (let i = 0; i < 7; i++) {
        const r0 = 200 + i*58, y0 = 2 + i*30;
        const riser = new THREE.Mesh(new THREE.CylinderGeometry(r0, r0, 30, 96, 1, true), crowdMat);
        riser.position.y = y0 + 15; g.add(riser);
        const walk = new THREE.Mesh(new THREE.RingGeometry(r0, r0 + 58, 96), stoneMat);
        walk.rotation.x = -Math.PI/2; walk.position.y = y0 + 30; g.add(walk);
      }
      // outer wall with dark arched openings, mostly swallowed by the haze
      const wv = document.createElement('canvas'); wv.width = 1024; wv.height = 256;
      const w = wv.getContext('2d');
      w.fillStyle = '#93835f'; w.fillRect(0, 0, 1024, 256);
      for (let x = 20; x < 1024; x += 86) {
        w.fillStyle = '#2c2618';
        w.beginPath(); w.moveTo(x, 220); w.lineTo(x, 120);
        w.arc(x + 23, 120, 23, Math.PI, 0); w.lineTo(x + 46, 220); w.closePath(); w.fill();
      }
      const wallTex = new THREE.CanvasTexture(wv);
      wallTex.wrapS = THREE.RepeatWrapping; wallTex.repeat.set(14, 1); wallTex.anisotropy = 8;
      wallTex.colorSpace = THREE.SRGBColorSpace;
      const wall = new THREE.Mesh(new THREE.CylinderGeometry(660, 660, 240, 128, 1, true),
        new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95, side: THREE.BackSide }));
      wall.position.y = 200; g.add(wall);
      // dust hanging in the raking sun — the air itself has depth, and depth reads as SIZE. Two
      // layers: a fine far haze of motes across the whole bowl, and a coarser near-camera drift of
      // bigger flecks that catch the light — the parallax between them sells the volume of air.
      const mkDust = (N, spreadR, spreadY, size, op, seed) => {
        let dr = seed; const rn = () => (dr = (dr*16807)%2147483647)/2147483647;
        const pos = new Float32Array(N*3);
        for (let i = 0; i < N; i++) {
          const th = rn()*Math.PI*2, rr = 20 + rn()*spreadR;
          pos[i*3] = Math.cos(th)*rr; pos[i*3+1] = 3 + rn()*spreadY; pos[i*3+2] = Math.sin(th)*rr;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        return new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffedc8, size, transparent: true,
          opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true }));
      };
      const dustFar = mkDust(1100, 380, 200, 1.3, 0.16, 909);
      const dustNear = mkDust(320, 200, 90, 3.2, 0.28, 313);
      g.add(dustFar, dustNear);
      g.userData.tick = t => {
        dustFar.rotation.y = t*0.003; dustFar.position.y = Math.sin(t*0.08)*2;
        dustNear.rotation.y = -t*0.006; dustNear.position.y = Math.sin(t*0.13 + 1)*3;
      };
      return g;
    },
  },
};
let T = THEMES.noir;   // set for real by applyTheme(THEME) once the scene exists

// theme switcher links — swap the look in place, no reload (applyTheme is hoisted from below)
{
  const el = document.getElementById('themes');
  const snd = document.createElement('a');
  snd.href = '#'; snd.textContent = '♪ off';
  snd.addEventListener('click', ev => {
    ev.preventDefault();
    if (!SND.ctx) sndInit();
    if (!SND.ready) return;
    SND.on = !SND.on;
    snd.textContent = SND.on ? '♪ on' : '♪ off';
    SND.ctx.resume();
    SND.master.gain.setTargetAtTime(SND.on ? SFX.master : 0, SND.ctx.currentTime, 0.1);
  });
  el.appendChild(snd);
  const gfx = document.createElement('a');
  gfx.href = '#'; gfx.id = 'gfxToggle'; gfx.textContent = 'gfx';
  gfx.addEventListener('click', ev => {
    ev.preventDefault();
    const order = ['high', 'balanced', 'light'];
    gfxMode = order[(order.indexOf(gfxMode) + 1) % order.length];
    applyGfx();
  });
  el.appendChild(gfx);
  const sep = document.createElement('span'); sep.className = 'sep'; el.appendChild(sep);
  for (const k of Object.keys(THEMES)) {
    const a = document.createElement('a');
    a.href = '?theme=' + k + (SHOW_FPS ? '&fps' : ''); a.textContent = k; a.dataset.theme = k;
    a.addEventListener('click', ev => { ev.preventDefault(); applyTheme(k); });
    el.appendChild(a);
  }
}

const ALIEN_GLSL = `
uniform float uAlien; uniform float uAlienTime; varying vec3 vWPos;

// Math theme's LIVE construction: every foot projects its pivot-sweep circle (radius footR*sqrt3
// — where that piece's other feet could land if this foot were pinned) onto the board. A ring is
// invisible along empty stretches and darkens where it approaches a crossing with an OPPOSITE-
// colour ring or a printed board line — computed per-pixel, so the whole construction glides
// live with every swing. closeness(other curves) does the intersection detection implicitly:
// near ring A and near curve B simultaneously = near their crossing.
const MATH_GLSL = `

  float d = mcurve(p, vec2(0.0), 40.0);

      '    for (int j = 0; j < 6; j++) {\n' +                          // near an opposite-colour ring?

function taperedLeg(curve, mat, legRad, radialSegs, lenSegs, taperFrac) {

    indices.push(a2, c2, b2, b2, c2, d2);

}

// Visual leg radius is a HAIR wider than the collision radius (1.05x) so when two pieces push
// (collision fires at CFG.legRadius*2 between centrelines) the visible tubes clearly OVERLAP —
// contact you can see, matched to contact you hear. Same girth as the shipped game's legs.

    // through each other at the top and weld into one closed junction — the open tube mouths are
    // buried inside the neighbouring tubes, so there is no gap and NO plug sphere at all (a plug
    // always found an angle to poke out at, and showed through noir's transparent glass)

const norm = a => { while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; };
const radU = p => Math.hypot(p.x, p.y);

class Piece {
  constructor(id) { this.id = id; this.x = 0; this.y = 0; this.rot = 0; }
  feet() {
    const r = CFG.footR, out = [];
    for (let i = 0; i < 3; i++) { const a = this.rot + i*(2*Math.PI/3);
      out.push({ x: this.x + Math.cos(a)*r, y: this.y + Math.sin(a)*r }); }
    return out;
  }
  rotateAround(px, py, dA) {
    const c = Math.cos(dA), s = Math.sin(dA), rx = this.x - px, ry = this.y - py;
    this.x = px + rx*c - ry*s; this.y = py + rx*s + ry*c; this.rot += dA;
  }
  anyFootOff() { return this.feet().some(f => radU(f) > CFG.edgeU + CFG.edgeEps); }
  legs() { const h = { x: this.x, y: this.y }; return this.feet().map(f => [h, f]); }
  legArcs() {
    const R = CFG.footR, H = CFG.hubHeight, N = CFG.legSegs, out = [];
    for (let i = 0; i < 3; i++) {
      const a = this.rot + i*(2*Math.PI/3), ca = Math.cos(a), sa = Math.sin(a), pts = [];
      for (let k = 0; k <= N; k++) {
        const ph = (k/N)*(Math.PI/2), s = Math.sin(ph)*R;
        pts.push({ x: this.x + ca*s, y: this.y + sa*s, h: Math.cos(ph)*H });
      }
      out.push(pts);
    }
    return out;
  }
}

// line-crossing rules
function angInSpan(deg, a0, a1) {

  deg = w(deg); const lo = w(a0), hi = w(a1);

  CFG.sideArcs.forEach((a, k) => {

    if (Math.abs(d - a.r) < eps && angInSpan(Math.atan2(f.y - a.cy, f.x - a.cx)*180/Math.PI, a.a0, a.a1)) ids.push('a'+k);

function crossingSubstep(before, after, st) {
  if (!st.contact) {
    st.contact = before.map(f => nearLineIds(f, CFG.touchEps));
    st.earned = before.map(f => nearLineIds(f, CFG.crossEps));
    st.startSide = before.map((f, i) => { const m = {}; for (const id of st.contact[i]) m[id] = lineSideOf(f, id); return m; });
    st.entrySide = [{}, {}, {}];

  for (let i = 0; i < 3; i++) {
    const hadContact = st.contact[i].length > 0;
    const near = nearLineIds(after[i], stickEps);
    const kept = st.contact[i].filter(id => near.includes(id));
    const earned = (st.earned && st.earned[i]) ? st.earned[i].slice() : st.contact[i].slice();
    for (const id of st.contact[i]) if (!near.includes(id) && !earned.includes(id)) {
      if (st.startSide && st.startSide[i] && st.startSide[i][id] !== undefined &&
          lineSideOf(after[i], id) !== st.startSide[i][id]) opened++;
    }
    for (const id of kept) {
      const sponsor = st.pendingMerge[i][id];
      if (sponsor === undefined) continue;
      const flipped = st.entrySide[i][id] !== undefined && lineSideOf(after[i], id) !== st.entrySide[i][id];
      if (flipped) {
        if (lineDistOf(after[i], sponsor) > CFG.holdEps) opened++;
        resolvedPending[i].push(id);
      } else if (lineDistOf(after[i], id) <= CFG.crossEps && lineDistOf(after[i], sponsor) > CFG.holdEps) {
        opened++;
        resolvedPending[i].push(id);
      }
    }
    let entered = false;
    for (const id of nearLineIds(after[i], CFG.touchEps))
      if (!kept.includes(id)) {
        let sponsorId;
        const atCorner = hadContact && kept.some(h => earned.includes(h) && LINE_INTERSECTIONS.some(P =>
          P.lines.includes(id) && P.lines.includes(h) &&
          Math.hypot(after[i].x - P.x, after[i].y - P.y) <= CFG.cornerEps) && (sponsorId = h, true));
        kept.push(id);
        if (!earned.includes(id)) earned.push(id);

    st.crossings += opened;

  st.contact = next;
  st.earned = nextEarned;
  for (let i = 0; i < 3; i++) {
    for (const id in newSides[i]) st.entrySide[i][id] = newSides[i][id];
    for (const id in newPending[i]) st.pendingMerge[i][id] = newPending[i][id];
    for (const id of resolvedPending[i]) delete st.pendingMerge[i][id];
    for (const id in st.pendingMerge[i]) if (!next[i].includes(id)) delete st.pendingMerge[i][id];

}

let G;
function reset() {

        crossings: 0, atLimit: false, netRad: 0, over: false, winner: null,
        snap: null, contact: null };

  G.turnDir = 0; G.crossings = 0; G.atLimit = false; G.netRad = 0; G.contact = null;

  const stepMax = CFG.substepDeg*Math.PI/180;

  for (let s = 0; s < steps; s++) {
    const before = active.feet();
    active.rotateAround(G.pivot.x, G.pivot.y, step);
    if (active.anyFootOff()) {
      active.rotateAround(G.pivot.x, G.pivot.y, -step); G.atLimit = true; break; }
    if (crossingSubstep(before, active.feet(), G)) {
      active.rotateAround(G.pivot.x, G.pivot.y, -step); G.atLimit = true; break; }

// the landing demo's wobbly heuristic brain (index.html's aiChoosePlan + demoComputePlan;

const AI_SAFETY_CAP_RAD = 170*Math.PI/180;

function directionToward(pivot, footPos, targetPos) {

  const ref = offense ? { x: other.x, y: other.y } : { x: 0, y: 0 };
  const feet = ai.feet();
  const order = [0, 1, 2].sort((p, q) =>
    radU({ x: feet[q].x - ref.x, y: feet[q].y - ref.y }) - radU({ x: feet[p].x - ref.x, y: feet[p].y - ref.y }));

// Decide the whole turn before any visible motion: run the swing to its natural limit on the
// ---- optional neural-net brain (?nn=path/to/model.json) --------------------------------------
// Load a checkpoint from the nn/ training kit and the battle uses it: red always plays the net,
// blue plays it too until a human grabs a foot — so ?nn=nn/models/best.json (served locally from
// the repo) lets you WATCH a checkpoint fight itself and PLAY it on the premium boards.
// nnFeatures/nnForward mirror nn/features.js and nn/net.js exactly — same 16 canonicalized
// inputs, same tanh MLP — and candidates are real engine swings, so the rules always hold.
let nnModel = null;
{
  const nnUrl = new URLSearchParams(location.search).get('nn');
  if (nnUrl) fetch(nnUrl).then(r => r.json()).then(j => {
    if (j && j.sizes && j.W && j.b) { nnModel = j; console.log('nn model loaded:', nnUrl); }
  }).catch(() => console.warn('nn model failed to load:', nnUrl));
}
function nnFeatures() {

      r.push(Math.hypot(p.x + Math.cos(a)*CFG.footR, p.y + Math.sin(a)*CFG.footR));

function nnPlanSteam(idx, temperature) {

    G.turnDir = 0; G.crossings = 0; G.atLimit = false; G.netRad = 0; G.contact = null;
    G.pinned = null; G.pivot = null;

  const minMove = CFG.minMoveDeg*Math.PI/180, cands = [];

    const full = G.netRad;

// Decide the whole turn before any visible motion: run the swing to its natural limit on the

    let total = 0;

    return G.netRad;
  };
  const rollback = () => {
    G.pieces.forEach((p, i) => { p.x = snap[i].x; p.y = snap[i].y; p.rot = snap[i].rot; });
    G.turnDir = 0; G.crossings = 0; G.atLimit = false; G.netRad = 0; G.contact = null;
  };

    const p = nnPlanSteam(G.active, 0.06);
    if (p) { pinFoot(p.pivotIdx); return { dir: p.dir, targetRad: p.targetRad }; }
  }
  const plan = aiChoosePlan(G.active);
  const feetNow = G.pieces[G.active].feet();
  const dir0 = directionToward(feetNow[plan.pivotIdx], feetNow[plan.swingIdx], plan.target);
  let sw = tryPivot(plan.pivotIdx, dir0);
  if (!sw) for (const p of [0, 1, 2].sort(() => Math.random() - 0.5)) {
    if (p === plan.pivotIdx) continue;
    sw = tryPivot(p, Math.random() < 0.5 ? 1 : -1);
    if (sw) break;
  }
  if (!sw) return null;
  const keepFrac = Math.random() < 0.5 ? 1 : (0.6 + Math.random()*0.3);   // 'easy' / 'dumb' roll
  return { dir: sw.dir, targetRad: sw.fullRad*keepFrac };

// the loser's tip-over-the-rim tumble (index.html's triggerFall/stepFall, on the tripod group)
let fall = { active: false };
const fallTipAxis = new THREE.Vector3();
const FALL_AXIS_X = new THREE.Vector3(1,0,0), FALL_AXIS_Y = new THREE.Vector3(0,1,0), FALL_AXIS_Z = new THREE.Vector3(0,0,1);

  fallLever.cross(fallAxisV).multiplyScalar(-fall.omega);

// driver: think → swing → (fall →) think, paced like the menu demo (3°/35ms ≈ 1.5 rad/s)
const SWING_RATE = 1.5;

  if (sim.state === 'human') return;   // the player is mid-swing — input events drive the game
  if (sim.state === 'think') {
    sim.t += dt;
    // blue's think pause is the takeover window: longer in attract mode (feet glow, inviting a
    // grab), 20s when a player owns blue (then the AI covers for them; two covers = attract again)
    const humanWait = playerMode && G.active === 0;
    const effWait = humanWait ? 20 : (G.active === 0 && !playerMode ? sim.wait + 1.1 : sim.wait);
    if (sim.t < effWait) return;
    if (humanWait) { player.idleCount++; if (player.idleCount >= 2) playerMode = false; }
    const plan = demoPlan();
    if (!plan) { clearTurn(); sim.t = 0; sim.wait = 0.5; return; }
    sim.plan = plan; sim.state = 'swing';
  } else if (sim.state === 'swing') {
    if (!G.atLimit && Math.abs(G.netRad) < Math.abs(sim.plan.targetRad)) {
      const rem = Math.abs(sim.plan.targetRad) - Math.abs(G.netRad);
      applySwing(sim.plan.dir*Math.min(SWING_RATE*dt, rem));
    } else {
      sim.plan = null; endTurn();
      if (G.over) { triggerFall(); sim.state = 'fall'; sim.t = 0; }
      else { sim.state = 'think'; sim.t = 0; sim.wait = 0.5 + Math.random()*0.45; }
    }
  } else if (sim.state === 'fall') {
    if (fall.active) stepFall(dt);
    sim.t += dt;
    if (sim.t > 3.4) {
      tripodGroups[fall.idx].visible = true;
      fall = { active: false };

  for (let i = 0; i < 2; i++) {
    if (fall.active && fall.idx === i) continue;

// ---- sound — the game's own pitch+noise voice, with steam-grade acoustics --------------------
// Ported from index.html's audio engine: ONE looped noise source, split into a resonant bandpass
// "voice" whose PITCH tracks the moving piece's distance from centre and whose VOLUME follows how
// fast its feet actually move this frame (silent at rest), plus a high-passed chalk-scrape
// channel — the same tuned SFX numbers as the game. New for the steam build: the synthesized
// cathedral reverb stays on at a low level during play (the game saves it for the loss swell),
// contact CLICKS fire straight off the physics (resolvePush), and the loser gets the game's
// pitch-climb-into-the-cathedral swell plus a deep 808 thud when they drop past the rim.
// No oscillator beeps, no ambient beds. All synthesized. OFF until the ♪ toggle is clicked.
const SFX = {
  master: 0.22, minHz: 340, maxHz: 4850, q: 4, highCut: 8000,
  speedRef: 80, speedGain: 0.3, scrape: 0.05, scrapeHz: 6000,
  reverb: 0.18, reverbEnd: 0.85,
  clickVol: 0.5, clickHz: 400, clickLen: 0.035,
  bassHz: 50, bassLen: 0.16, bassVol: 0.5,

const SND = { on: false, ctx: null, ready: false, prevFeet: null, lastClickT: 0,

function sndNoiseBuf(c, secs) {
  const buf = c.createBuffer(1, Math.floor(c.sampleRate*secs), c.sampleRate);

}

  const band = c.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = SFX.minHz; band.Q.value = SFX.q;
  const voice = c.createGain(); voice.gain.value = 0;
  const scrHP = c.createBiquadFilter(); scrHP.type = 'highpass'; scrHP.frequency.value = SFX.scrapeHz;
  const scrape = c.createGain(); scrape.gain.value = 0;
  const toneLP = c.createBiquadFilter(); toneLP.type = 'lowpass'; toneLP.frequency.value = SFX.highCut;
  const dry = c.createGain(); dry.gain.value = 1 - SFX.reverb;
  const conv = c.createConvolver();
  {   // synthesized cathedral impulse (the game's makeCathedralImpulse)
    const len = Math.floor(c.sampleRate*3.2), buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);

function sndClick(vol) {   // chalk click: a short high-passed noise tick — never an oscillator

  const feet = [G.pieces[0].feet(), G.pieces[1].feet()];
  let speed = 0, radFrac = 0;

      const d = Math.hypot(feet[p][i].x - SND.prevFeet[p][i].x, feet[p][i].y - SND.prevFeet[p][i].y)/dt;

    }

  }

  if (!G.over) {
    SND.band.frequency.setTargetAtTime(SFX.minHz*Math.pow(SFX.maxHz/SFX.minHz, radFrac), now, 0.03);
    const lvl = Math.min(1, speed/Math.max(1, SFX.speedRef))*SFX.speedGain;

    // the pieces are actually rubbing — silent when the shove stalls, harsh when it drives through

  const swinging = sim.state === 'swing' ||
    (sim.state === 'human' && (player.phase === 'drag' || player.phase === 'pad') && Math.abs(G.netRad) > 0.01);
  if (swinging && !SND.wasSwing) sndBass(SFX.bassHz, SFX.bassLen, SFX.bassVol);
  SND.wasSwing = swinging;
  // the throw: the voice recedes into the cathedral (the game's loss swell)…
  if (fall.active && !SND.swellDone) {
    SND.swellDone = true; SND.thudDone = false;
    const cur = SND.band.frequency.value;
    SND.band.frequency.cancelScheduledValues(now);
    SND.band.frequency.setValueAtTime(cur, now);
    SND.band.frequency.setTargetAtTime(SFX.maxHz*1.8, now, 1.2);
    SND.voice.gain.cancelScheduledValues(now);
    SND.voice.gain.setValueAtTime(Math.max(SND.voice.gain.value, 0.2), now);
    SND.voice.gain.setTargetAtTime(0, now, 0.3);
    SND.scrape.gain.setTargetAtTime(0, now, 0.1);
    SND.wet.gain.setTargetAtTime(SFX.reverbEnd, now, 0.12);
    SND.dry.gain.setTargetAtTime(1 - SFX.reverbEnd, now, 0.12);

// ---- player control — the game's own scheme, on both boards --------------------------------
// Click a blue foot to PIN it as the pivot (ring + dotted sweep guides appear and stay); then
// click-and-drag one of the OTHER feet to swing it along its arc — the drag feeds the same
// applySwing as everything else, so the crossing budget, direction lock and rim block all hold.
// Release commits (a sub-2-degree release just re-arms the pin). Click the pivot again, or empty
// board, to cancel. Works identically on the 3D scene and the 2D top-down board (bottom-left),
// which doubles as a minimap while the AIs battle. Gamepad: stick aims, A pins, stick swings,
// A commits, B cancels. Ignore your turn long enough and blue goes back to playing itself.
let playerMode = false;
const player = { phase: 'idle', hover: -1, drag: null, idleCount: 0, pinT: 0 };
// phase: 'idle' | 'pinned' (pivot chosen, waiting for a handle) | 'drag' (pointer) | 'pad' (gamepad)
const rayc = new THREE.Raycaster(), ndcV = new THREE.Vector2();
const planeY = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), planePt = new THREE.Vector3();
const footW = new THREE.Vector3();
const canBlueMove = () => sim.state === 'think' && G.active === 0 && !G.over && !fall.active;
const isPinned = () => sim.state === 'human' && (player.phase === 'pinned' || player.phase === 'pad');

// 3D affordances: glow discs on grabbable feet, a ring on the pivot, dotted sweep guides
const hoverDiscs = [0, 1, 2].map(() => {
  const m = new THREE.Mesh(new THREE.CircleGeometry(3.4, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4,
      blending: THREE.AdditiveBlending, depthWrite: false }));
  m.rotation.x = -Math.PI/2; m.visible = false; scene.add(m);
  return m;
});
const pivotRing = new THREE.Mesh(new THREE.RingGeometry(2.6, 3.7, 28),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
pivotRing.rotation.x = -Math.PI/2; pivotRing.visible = false; scene.add(pivotRing);
const guideGeo = new THREE.BufferGeometry();
const guideMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, transparent: true,
  opacity: 0.7, depthWrite: false });
const guidePts = new THREE.Points(guideGeo, guideMat);
guidePts.visible = false; guidePts.frustumCulled = false; scene.add(guidePts);
let guide2d = null;   // { pv, cw, ccw, arcs:[{R, a0}] } — the same rail, for the 2D board

function pointerNDC(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndcV.set(((ev.clientX - r.left)/r.width)*2 - 1, -((ev.clientY - r.top)/r.height)*2 + 1);
  rayc.setFromCamera(ndcV, camera);
}
function hitFoot(ev) {
  pointerNDC(ev);

  let best = -1, bd = 1e9;
  for (let i = 0; i < 3; i++) {
    const d = rayc.ray.distanceToPoint(footW.set(feet[i].x, 0.8, feet[i].y));
    if (d < 5.5 && d < bd) { bd = d; best = i; }

  if (Math.hypot(planePt.x - G.pivot.x, planePt.z - G.pivot.y) < 8) return null;

// dotted sweep guides: run the pinned swing to its legal limit both ways (then roll back), and
// dot each free foot's circular path across exactly that reachable range — coach mode's rail
function buildGuides() {
  const snap = takeSnap();
  const look = d => {
    let tot = 0;
    while (Math.abs(tot) < AI_SAFETY_CAP_RAD) { applySwing(d*DEMO_STEP_RAD); tot = G.netRad; if (G.atLimit) break; }
    return G.netRad;
  };
  const roll = () => {
    G.pieces.forEach((p, i) => { p.x = snap[i].x; p.y = snap[i].y; p.rot = snap[i].rot; });
    G.turnDir = 0; G.crossings = 0; G.atLimit = false; G.netRad = 0; G.contact = null;

    const a0 = Math.atan2(feet[i].y - pv.y, feet[i].x - pv.x);

// the shared operations both boards (and the gamepad) drive
function uiPin(f) {
  if (canBlueMove()) { sim.state = 'human'; playerMode = true; player.idleCount = 0; }
  else if (sim.state !== 'human') return;
  pinFoot(f);
  buildGuides();
  player.phase = 'pinned'; player.pinT = 0; player.drag = null;
}
function uiUnpin() {
  if (sim.state !== 'human') return;
  restoreSnap(); clearTurn();
  guide2d = null; controls.enabled = true;
  player.phase = 'idle'; player.drag = null;
  sim.state = 'think'; sim.t = 0; sim.wait = 0.4;   // still blue's turn — waits for the player
}
function uiStartDrag() {
  player.phase = 'drag'; player.drag = { last: null }; player.pinT = 0;
  controls.enabled = false;
}
function uiDrag(a) {
  if (a === null || !player.drag) return;
  if (player.drag.last === null) { player.drag.last = a; return; }
  const dA = norm(a - player.drag.last);
  player.drag.last = a;
  applySwing(dA);
}
function uiRelease() {
  if (player.phase !== 'drag' && player.phase !== 'pad') return;
  controls.enabled = true; player.drag = null;
  if (Math.abs(G.netRad) >= CFG.minMoveDeg*Math.PI/180) {
    guide2d = null; player.phase = 'idle';
    endTurn();

    else { sim.state = 'think'; sim.t = 0; sim.wait = 0.5 + Math.random()*0.45; }

  if (isPinned()) {

    if (f >= 0) { startDrag(); return true; }
    uiUnpin(); return false;
  }

renderer.domElement.addEventListener('pointerdown', ev => {
  const f = (canBlueMove() || isPinned()) ? hitFoot(ev) : -1;

addEventListener('pointercancel', () => {

// ---- the 2D board: the game's classic top-down view, playable and always live ----------------
const cv2 = document.getElementById('board2d'), ctx2 = cv2.getContext('2d');
function size2d() {
  const r = cv2.getBoundingClientRect(), s2 = Math.round(r.width * (devicePixelRatio || 1));

size2d();
function board2dPos(ev) {

  const x = (ev.clientX - r.left)/r.width*w, y = (ev.clientY - r.top)/r.height*w;

function hitFoot2d(ev) {
  const p = board2dPos(ev), feet = G.pieces[0].feet();
  let best = -1, bd = 1e9;
  for (let i = 0; i < 3; i++) {

    if (d < 7 && d < bd) { bd = d; best = i; }

}
function dragAngle2d(ev) {
  const p = board2dPos(ev);
  if (Math.hypot(p.x - G.pivot.x, p.y - G.pivot.y) < 8) return null;

cv2.addEventListener('pointerdown', ev => {

}
function draw2d(now) {

  ctx2.clearRect(0, 0, w, w);
  ctx2.fillStyle = 'rgba(26,30,38,0.92)';

      ctx2.beginPath(); ctx2.moveTo(hx, hy); ctx2.lineTo(o + f.x*sc2, o + f.y*sc2); ctx2.stroke();
    }
    ctx2.fillStyle = col;
    for (const f of feet) { ctx2.beginPath(); ctx2.arc(o + f.x*sc2, o + f.y*sc2, w*0.016, 0, 7); ctx2.fill(); }
    ctx2.beginPath(); ctx2.arc(hx, hy, w*0.011, 0, 7); ctx2.fill();
  }
  const invite = canBlueMove(), pinned = isPinned();
  if (invite || pinned) {   // halo the grabbable feet (all three to pin; the two handles once pinned)
    const feet = G.pieces[0].feet();
    for (let i = 0; i < 3; i++) {
      if (pinned && i === G.pinned) continue;
      ctx2.strokeStyle = guideCol(0.35 + 0.2*Math.sin(now/300 + i*2.1));
      ctx2.lineWidth = Math.max(1.5, w*0.006);
      ctx2.beginPath(); ctx2.arc(o + feet[i].x*sc2, o + feet[i].y*sc2, w*0.032, 0, 7); ctx2.stroke();
    }
  }
}

// gamepad: stick aims, A pins, stick X swings, A commits, B cancels
const pad = { lastA: false, lastB: false };
const padV = { right: new THREE.Vector3(), fwd: new THREE.Vector3() };
function padTick(dt) {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const g of gps) if (g && g.connected) { gp = g; break; }
  if (!gp) return;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, mag = Math.hypot(ax, ay);
  const A = !!(gp.buttons[0] && gp.buttons[0].pressed), B = !!(gp.buttons[1] && gp.buttons[1].pressed);
  const aEdge = A && !pad.lastA, bEdge = B && !pad.lastB;
  pad.lastA = A; pad.lastB = B;
  if ((mag > 0.5 || aEdge) && (canBlueMove() || sim.state === 'human')) { playerMode = true; player.idleCount = 0; }
  if (canBlueMove()) {
    if (mag > 0.5) {   // stick direction (screen space) → board direction → nearest foot that way
      padV.right.setFromMatrixColumn(camera.matrixWorld, 0); padV.right.y = 0; padV.right.normalize();
      camera.getWorldDirection(padV.fwd); padV.fwd.y = 0; padV.fwd.normalize();
      const dx = padV.right.x*ax - padV.fwd.x*ay, dz = padV.right.z*ax - padV.fwd.z*ay;
      const p0 = G.pieces[0], feet = p0.feet();
      let best = 0, bs = -1e9;
      for (let i = 0; i < 3; i++) {
        const sc = (feet[i].x - p0.x)*dx + (feet[i].y - p0.y)*dz;
        if (sc > bs) { bs = sc; best = i; }
      }
      player.hover = best;
    }
    if (aEdge && player.hover >= 0) { uiPin(player.hover); player.phase = 'pad'; }
  } else if (sim.state === 'human' && player.phase === 'pad') {
    if (Math.abs(ax) > 0.15) { applySwing(ax*1.6*dt); player.pinT = 0; }
    if (aEdge) uiRelease();
    if (bEdge) uiUnpin();
  }
}
let lastTag = '';
function updateTag() {
  if (SHOW_FPS) return;
  let s;
  if (player.phase === 'drag') s = 'release to commit the swing';
  else if (player.phase === 'pad') s = 'swing with the stick · A commit · B cancel';
  else if (isPinned()) s = 'pivot set — drag one of the other feet · click the pivot to cancel';
  else if (canBlueMove()) s = playerMode ? 'your move — click a blue foot to pivot'
                                         : 'watching — click a glowing blue foot to play';
  else if (playerMode && !G.over) s = 'red moves…';
  else s = 'tau · premium spike — drag to orbit';
  if (s !== lastTag) { lastTag = s; document.getElementById('tag').textContent = s; }
}
function playerTick(dt, now) {
  const invite = canBlueMove(), pinned = isPinned();
  const feet = (invite || pinned) ? G.pieces[0].feet() : null;
  for (let i = 0; i < 3; i++) {
    const d = hoverDiscs[i];
    d.visible = invite || (pinned && i !== G.pinned);
    if (d.visible) {
      d.position.set(feet[i].x, 0.4, feet[i].y);
      d.material.opacity = i === player.hover ? 0.85 : 0.3 + 0.15*Math.sin(now/300 + i*2.1);
    }
  }
  const showPin = sim.state === 'human' && !!G.pivot;
  pivotRing.visible = showPin;
  if (showPin) pivotRing.position.set(G.pivot.x, 0.4, G.pivot.y);
  guidePts.visible = showPin;
  if (pinned) { player.pinT += dt; if (player.pinT > 25) uiUnpin(); }   // parked pin → attract resumes
  padTick(dt);
  updateTag();
  draw2d(now);
}

// ---- post ------------------------------------------------------------------------------------
// The composer must bring its own MSAA: post-processing renders into an offscreen target, so the
// canvas's antialias flag stops applying the moment a composer is used — that unantialiased
// buffer was exactly the "pixelated at 4K" complaint.
const composerRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: HI_RES ? 8 : 4 });
const composer = new EffectComposer(renderer, composerRT);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.2, 0.5, 0.9);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ---- graphics presets: one link cycles the knobs that actually cost frames -------------------
const GFX = {
  high:     { pr: 2,   reflect: true,  bloom: true,  shadow: true },
  balanced: { pr: 1.5, reflect: true,  bloom: true,  shadow: true },
  light:    { pr: 1,   reflect: false, bloom: false, shadow: false },
};
let gfxMode = localStorage.getItem('tauSteamGfx') || 'high';
if (!GFX[gfxMode]) gfxMode = 'high';
function sizeAll() {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth, innerHeight);
  reflector.getRenderTarget().setSize(
    Math.max(256, Math.floor(innerWidth  * (devicePixelRatio || 1) / 2)),
    Math.max(256, Math.floor(innerHeight * (devicePixelRatio || 1) / 2)));
  size2d();
}
function applyGfx() {
  const g = GFX[gfxMode];
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, g.pr));
  key.castShadow = g.shadow;
  bloomPass.enabled = g.bloom;
  sizeAll();
  document.getElementById('gfxToggle').textContent = 'gfx: ' + gfxMode;
  localStorage.setItem('tauSteamGfx', gfxMode);
}
applyGfx();

// ---- apply a theme in place: repaint the board, reskin the pieces, relight -------------------
let envGroup = null;   // optional per-theme world around the board (colossus' stands, dust…)
function applyTheme(name) {
  if (!THEMES[name]) name = 'noir';
  THEME = name; T = THEMES[name];
  renderer.toneMappingExposure = T.exposure;
  scene.background.set(T.bg);
  key.color.set(T.key.color); key.intensity = T.key.intensity; key.position.set(...T.key.pos);
  key.shadow.intensity = T.key.shadow;
  fill.color.set(T.fill.color); fill.intensity = T.fill.intensity;
  const maps = T.paint();
  for (const k of ['map', 'roughnessMap', 'bumpMap', 'emissiveMap']) if (boardMat[k]) boardMat[k].dispose();
  boardMat.map = tex(maps.albedo); boardMat.roughnessMap = texL(maps.rough); boardMat.bumpMap = texL(maps.bump);
  if (maps.emissive) {   // a board that makes its own light (alien's bioluminescent channels)
    boardMat.emissiveMap = tex(maps.emissive); boardMat.emissive.set(0xffffff);
    boardMat.emissiveIntensity = T.emissiveIntensity || 1;
  } else { boardMat.emissiveMap = null; boardMat.emissive.set(0x000000); boardMat.emissiveIntensity = 1; }
  boardMat.bumpScale = T.bumpScale; boardMat.envMapIntensity = T.boardEnv; boardMat.needsUpdate = true;
  scene.fog = T.fog ? new THREE.FogExp2(T.fog.color, T.fog.density) : null;
  slabMat.color.set(T.slabColor);
  bandMat.color.set(T.band.color); bandMat.roughness = T.band.rough; bandMat.metalness = T.band.metal;
  tableMat.color.set(T.tableColor);
  tripodGroups.forEach((g, gi) => {
    const mats = T.pieces(gi === 0 ? 'blue' : 'red');
    g.traverse(o => { if (o.isMesh && o.userData.part) { o.material.dispose(); o.material = mats[o.userData.part]; } });
  });
  bloomPass.strength = T.bloom[0]; bloomPass.radius = T.bloom[1]; bloomPass.threshold = T.bloom[2];
  if (envGroup) {
    scene.remove(envGroup);
    envGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
  }
  envGroup = T.env ? T.env() : null;
  if (envGroup) scene.add(envGroup);
  const cam = T.cam || { pos: [-18, 58, 122], target: [0, 4, 0], fov: 42 };
  camera.position.set(...cam.pos); controls.target.set(...cam.target);
  camera.fov = cam.fov; camera.updateProjectionMatrix(); controls.update();
  const gcol = T.guide || 0xffffff;   // input affordances follow the theme's ink
  guideMat.color.set(gcol); pivotRing.material.color.set(gcol);
  hoverDiscs.forEach(d => d.material.color.set(gcol));
  document.querySelectorAll('#themes a').forEach(a => a.className = a.dataset.theme === name ? 'cur' : '');
  history.replaceState(null, '', '?theme=' + name + (SHOW_FPS ? '&fps' : ''));
  if (!SHOW_FPS) document.getElementById('tag').textContent = 'tau · premium spike — drag to orbit';
}
applyTheme(THEME);

addEventListener('resize', sizeAll);

let frames = 0, fpsAcc = 0, fpsN = 0, lastT = performance.now();
const tag = document.getElementById('tag');
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT)/1000);   // clamp: a background tab must not fast-forward the sim
  simTick(dt * (T.simSpeed || 1));                 // colossus runs slow: giant things move slowly
  syncPieces();
  sndTick(dt);
  playerTick(dt, now);
  if (envGroup && envGroup.userData.tick) envGroup.userData.tick(now/1000);
  reflector.visible = GFX[gfxMode].reflect && (T.boardReflect || 0) > 0.001;
  if (boardMat.userData.shader) {
    const u = boardMat.userData.shader.uniforms;
    u.uReflStrength.value = T.boardReflect || 0;
    u.uAlien.value = (THEME === 'alien') ? 1 : 0;
    u.uAlienTime.value = now/1000;
    u.uMath.value = (THEME === 'math') ? 1 : 0;
    if (THEME === 'math') {   // the live construction follows the feet through every swing
      for (let pi = 0; pi < 2; pi++) {
        const feet = G.pieces[pi].feet();
        for (let fi = 0; fi < 3; fi++) u.uFeet.value[pi*3 + fi].set(feet[fi].x, feet[fi].y);
      }
    }
    reflMatrix.copy(REFL_BIAS).multiply(reflector.camera.projectionMatrix).multiply(reflector.camera.matrixWorldInverse);
  }
  controls.update();
  composer.render();
  if (SHOW_FPS) {
    fpsAcc += 1000 / Math.max(1, now - lastT); fpsN++;
    if (fpsN >= 30) { tag.textContent = `tau · ${THEME} · ${(fpsAcc/fpsN).toFixed(0)} fps`; fpsAcc = fpsN = 0; }
  }
  lastT = now;
  if (++frames === 6) window.__spikeReady = true;   // headless screenshot hook
}
loop();
</script>
</body>
</html>
