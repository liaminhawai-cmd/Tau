name: Native builds (Android / iOS / Steam)

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**', 'feature/steam-*']
    # Everything the shells actually ship, which is whatever native/scripts/sync-www.mjs copies
    # into www/ -- plus the wrappers themselves and this file. The two lists had drifted: the
    # filter named only index.html, steam.html and desktop/**, so a commit touching sw.js, the
    # manifest, an icon or the three.js bundle built nothing on any platform and left the pull
    # request with no checks at all. desktop-ships.test.cjs fails if they drift again.
    paths:
      - 'native/**'
      - '.github/workflows/native-builds.yml'
      - 'index.html'
      - 'steam.html'
      - 'desktop/**'
      - 'vendor/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'apple-touch-icon.png'
      - 'favicon-32.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'tau-logo.png'

jobs:
  android:
    if: ${{ !startsWith(github.ref, 'refs/heads/feature/steam-') }}
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: native/app
        run: |
          npm ci
          npm run sync-www
          npx cap sync android
          cd android
          ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tau-android-debug-apk
          path: native/app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tau-android-release-aab-unsigned
          path: native/app/android/app/build/outputs/bundle/release/app-release.aab

  ios:
    if: ${{ !startsWith(github.ref, 'refs/heads/feature/steam-') }}
    name: iOS (unsigned .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: native/app
        run: |
          npm ci
          npm run sync-www
          npx cap sync ios
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent \
            build/Build/Products/Release-iphoneos/App.app \
            Tau-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tau-ios-unsigned-app
          path: native/app/ios/App/Tau-ios-unsigned.zip

  steam:
    name: Steam (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            script: dist:win
            out: native/steam/dist/win-unpacked
          - os: ubuntu-latest
            label: linux
            script: dist:linux
            out: native/steam/dist/linux-unpacked
          - os: macos-latest
            label: macos
            script: dist:mac
            out: native/steam/dist/mac*/Tau.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Cone mode always includes root-level files (index.html, steam.html…);
          # vendor/ holds the showcase's Three.js modules. .github is here because this job runs
          # the test suite, and desktop-ships.test.cjs reads this very file to check that
          # everything sync-www.mjs ships is something a push to it would build.
          sparse-checkout: |
            native
            desktop
            vendor
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: native/steam
        run: |
          npm ci
          npm test
          npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: tau-steam-${{ matrix.label }}
          path: ${{ matrix.out }}
