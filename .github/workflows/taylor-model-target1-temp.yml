name: Taylor model Target1 regression (temporary)
# Triggered by the follow-up commit after workflow creation.

on:
  push:
    branches:
      - claude/target1-param-taylor-cert

permissions:
  contents: read

jobs:
  taylor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Fetch only Taylor-model sources
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          owner_repo = "liaminhawai-cmd/Tau"
          branch = "claude/target1-param-taylor-cert"
          tree_url = f"https://api.github.com/repos/{owner_repo}/git/trees/{branch}?recursive=1"
          req = Request(tree_url, headers={"Accept": "application/vnd.github+json", "User-Agent": "tau-taylor-regression"})
          tree = json.load(urlopen(req))
          wanted = []
          for item in tree["tree"]:
              p = item["path"]
              if p == "index.html" or p == "nn/engine.js" or (
                  p.startswith("docs/geometry-reviews/taylor-model/") and
                  not p.startswith("docs/geometry-reviews/taylor-model/results/")
              ):
                  if item["type"] == "blob":
                      wanted.append(p)
          for p in wanted:
              url = f"https://raw.githubusercontent.com/{owner_repo}/{branch}/{p}"
              req = Request(url, headers={"User-Agent": "tau-taylor-regression"})
              data = urlopen(req).read()
              out = Path(p)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
          print("fetched", len(wanted), "source files")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Taylor-model operation regression
        working-directory: docs/geometry-reviews/taylor-model
        run: node test-tm.js
      - name: Target1 adaptive cover
        working-directory: docs/geometry-reviews/taylor-model
        env:
          PROBLEM: target1
          SYMREM: "1"
          VTX: "1"
          MAXPASSES: "8000"
          MAXOPS: "3500000"
        run: node cover2.js 2 1 2 9.6828 4
      - name: Target1 audit
        working-directory: docs/geometry-reviews/taylor-model
        env:
          PROBLEM: target1
          SYMREM: "1"
          VTX: "1"
        run: node audit2.js 2 1 2 9.6828 4
      - name: Target1 containment
        working-directory: docs/geometry-reviews/taylor-model
        env:
          PROBLEM: target1
          SYMREM: "1"
          VTX: "1"
          DEG: "4"
        run: node contain2.js 2 1 2 9.6828 plain 5
      - name: Target1 red legality
        working-directory: docs/geometry-reviews/taylor-model
        env:
          PROBLEM: target1
          SYMREM: "1"
          VTX: "1"
        run: node legal-red.js 2 1 2 9.6828 4
