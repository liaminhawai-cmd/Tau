name: Queue compaction apply

on:
  push:
    branches:
      - claude/board-game-video-adaptation-cf8a93

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'queue-compaction-apply-stage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/board-game-video-adaptation-cf8a93
          fetch-depth: 0
          filter: 'blob:none'
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            nn/evolution-roster.js
            nn/elorank-legacy.js
            nn/.queue-compaction-patch.py
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nn/.queue-compaction-patch.py')
          s=p.read_text()
          old='s=block_re.sub(new_block,s,count=1)'
          new='s=block_re.sub(lambda m:new_block,s,count=1)'
          if s.count(old)!=1: raise SystemExit(f'patch-script lambda fix expected 1, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          python nn/.queue-compaction-patch.py
          node --check nn/evolution-roster.js
          node --check nn/elorank-legacy.js
          node -e "const e=require('./nn/evolution-roster.js'); if(!e.status||!e.FACE_CAPS) process.exit(2); console.log(e.FACE_CAPS)"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nn/evolution-roster.js nn/elorank-legacy.js
          git commit -m 'nn: compact stale face queue and share model evidence'
          git checkout -- nn/.queue-compaction-patch.py
          git pull --rebase origin claude/board-game-video-adaptation-cf8a93
          git push origin HEAD:claude/board-game-video-adaptation-cf8a93
