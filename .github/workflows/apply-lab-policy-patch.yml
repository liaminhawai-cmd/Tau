name: Apply Lab policy patch

on:
  push:
    branches:
      - claude/board-game-video-adaptation-cf8a93

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/board-game-video-adaptation-cf8a93
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            .github/workflows/patch-lab-policy.yml
      - name: Reuse guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/patch-lab-policy.yml').read_text()
          needle="          python - <<'PY'\n"
          start=w.index(needle)+len(needle)
          end=w.index("\n          PY",start)
          lines=w[start:end].splitlines()
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path('/tmp/lab-policy-patch.py').write_text(body)
          PY
          python /tmp/lab-policy-patch.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'application/ld+json' not in m.group(1).lower(): scripts.append(m.group(2))
          if not scripts: raise SystemExit('no game script found')
          main=max(scripts,key=len)
          Path('/tmp/tau-main.js').write_text(main,encoding='utf-8')
          print('main script bytes',len(main.encode()))
          PY
          node --check /tmp/tau-main.js
          grep -q "function nnPolicyPredictGame" index.html
          grep -q "policyEntrant" index.html
          grep -q "pairwise-memory-v1" index.html
      - name: Commit Lab support
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'lab: play separate and joint policy models'
          git pull --rebase origin claude/board-game-video-adaptation-cf8a93
          git push origin HEAD:claude/board-game-video-adaptation-cf8a93
