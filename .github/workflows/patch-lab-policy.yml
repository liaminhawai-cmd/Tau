name: Patch Lab policy model support

on:
  push:
    branches:
      - claude/board-game-video-adaptation-cf8a93

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'lab: stage policy model support'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/board-game-video-adaptation-cf8a93
          fetch-depth: 0
      - name: Patch Lab policy support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def exact(old, new, expected=1, label='replacement'):
              global s
              n = s.count(old)
              if n != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {n}')
              s = s.replace(old, new)

          exact("let nnModel = null, nnModelName = '';",
                "let nnModel = null, nnPolicyModel = null, nnModelName = '';",
                label='global policy model slot')

          # A normal #nn load must not accidentally inherit the policy from a previous Lab game.
          exact("        nnModel = j; nnModelName = file.name;",
                "        nnModel = j; nnPolicyModel = null; nnModelName = file.name;",
                label='plain nn loader policy reset')

          marker = "// Mirrors nn/nnai.js exactly (dense ~3deg waypoint sweep, plateau-vs-needle smoothing, optional\n"
          if s.count(marker) != 1:
              raise SystemExit(f'policy helper insertion marker: expected 1, found {s.count(marker)}')
          helper = r'''// Browser mirror of nn/policy.js prediction. A separate policy checkpoint is NOT a value
// evaluator: it only orders the six canonical pivot/direction arms while the paired value model
// still scores positions. Supports both legacy 22-output policy nets and the 96-action joint nets,
// including the dense-memory and pairwise-memory topologies used by the wild policy expedition.
function nnPolicyPredictGame(x, model) {
    if (!model || !model.policy || !Array.isArray(model.sizes) || !Array.isArray(model.W) || !Array.isArray(model.b))
        throw new Error('invalid Tau policy model');
    const sizes = model.sizes, W = model.W, b = model.b;
    const fanIns = Array.isArray(model.fanIns) ? model.fanIns : sizes.slice(0, -1);
    const topology = model.topology || null, kind = topology && topology.kind;
    const dense = kind === 'dense-memory-v1', pairwise = kind === 'pairwise-memory-v1';
    if (kind && !dense && !pairwise) throw new Error('unsupported policy topology: ' + kind);
    const memoryWidth = (dense || pairwise) ? (+topology.memoryWidth || 0) : 0;
    const residualScale = (dense || pairwise) ? (+topology.residualScale || 0) : 0;
    let a = Array.from(x), memories = [], history = [];
    for (let l = 0; l < W.length; l++) {
        let aIn = a;
        if (dense && l > 0) {
            const earlier = memories.slice(0, -1);
            aIn = new Array(a.length + earlier.length*memoryWidth);
            for (let i = 0; i < a.length; i++) aIn[i] = a[i];
            let off = a.length;
            for (const m of earlier) { for (let i = 0; i < m.length; i++) aIn[off+i] = m[i]; off += m.length; }
        } else if (pairwise && l > 1) {
            const earlier = history.slice(0, -1), messages = [];
            for (let srcNo = 0; srcNo < earlier.length; srcNo++) {
                const src = earlier[srcNo], P = model.skipW && model.skipW[l] && model.skipW[l][srcNo];
                const pb = model.skipB && model.skipB[l] && model.skipB[l][srcNo];
                if (!P || !pb) throw new Error(`pairwise policy missing skip ${srcNo}->${l}`);
                const m = new Array(memoryWidth);
                for (let j = 0; j < memoryWidth; j++) {
                    let sum = pb[j];
                    for (let i = 0; i < src.length; i++) sum += P[j*src.length+i]*src[i];
                    m[j] = Math.tanh(sum);
                }
                messages.push(m);
            }
            aIn = new Array(a.length + messages.length*memoryWidth);
            for (let i = 0; i < a.length; i++) aIn[i] = a[i];
            let off = a.length;
            for (const m of messages) { for (let i = 0; i < m.length; i++) aIn[off+i] = m[i]; off += m.length; }
        }
        const nIn = fanIns[l], nOut = sizes[l+1], z = new Array(nOut), last = l === W.length - 1;
        if (aIn.length !== nIn) throw new Error(`policy layer ${l} input ${aIn.length}, expected ${nIn}`);
        for (let j = 0; j < nOut; j++) {
            let sum = b[l][j];
            for (let i = 0; i < nIn; i++) sum += W[l][j*nIn+i]*aIn[i];
            if (last) z[j] = sum;
            else {
                const branch = Math.tanh(sum);
                z[j] = (dense || pairwise) && l > 0 ? a[j] + residualScale*branch : branch;
            }
        }
        if (dense && l < W.length - 1) memories.push(z.slice(0, memoryWidth));
        if (pairwise && l < W.length - 1) history.push(z);
        a = z;
    }
    if (a.length === NN_ARMS + NN_BINS)
        return { arms: nnSoftmaxSlice(a, 0, NN_ARMS), bins: nnSoftmaxSlice(a, NN_ARMS, NN_ARMS + NN_BINS) };
    const jointActions = 3*NN_BINS*2;
    if (a.length === jointActions) {
        const actions = nnSoftmaxSlice(a, 0, jointActions), arms = new Array(NN_ARMS).fill(0);
        for (let action = 0; action < actions.length; action++) {
            const leg = Math.floor(action/(NN_BINS*2)), within = action%(NN_BINS*2);
            const canonDir = within < NN_BINS ? 1 : -1;
            arms[leg*2 + (canonDir > 0 ? 0 : 1)] += actions[action];
        }
        return { actions, arms };
    }
    throw new Error(`policy output layer is ${a.length}; expected ${NN_ARMS + NN_BINS} or ${jointActions}`);
}

'''
          s = s.replace(marker, helper + marker)

          exact("function nnPlanForGame(idx, temperature, depth, keepForDepth, model) {\n    model = model || nnModel;",
                "function nnPlanForGame(idx, temperature, depth, keepForDepth, model, policyModel) {\n    model = model || nnModel;\n    if (policyModel === undefined) policyModel = (model === nnModel ? nnPolicyModel : null);",
                label='nnPlanForGame signature')
          exact("                const oppPlan = nnPlanForGame(1 - idx, 0, depth - 1, keepForDepth, model);",
                "                const oppPlan = nnPlanForGame(1 - idx, 0, depth - 1, keepForDepth, model, policyModel);",
                label='recursive policy propagation')

          old_arm = '''    let armList = [];
    for (let pv = 0; pv < 3; pv++) for (const dir of [1, -1]) armList.push({ pv, dir });
    if (model && model.dual) {
        const frame = nnMoveFrame();
        const { arms } = nnDualPredictGame(nnFeaturesGame(), model);
        const armKey = a => a.pv*2 + (a.dir > 0 ? 1 : 0);
        const score = new Map();
        for (let ai = 0; ai < arms.length; ai++) {
            const slot = ai >> 1, canonDir = (ai & 1) === 0 ? 1 : -1;
            score.set(frame.order[slot]*2 + ((canonDir*frame.mirror) > 0 ? 1 : 0), arms[ai]);
        }
        armList.sort((a, b) => (score.get(armKey(b)) || 0) - (score.get(armKey(a)) || 0));
    }
'''
          new_arm = '''    let armList = [];
    for (let pv = 0; pv < 3; pv++) for (const dir of [1, -1]) armList.push({ pv, dir });
    // A dual net carries its policy in the same checkpoint. A policy entrant carries a separate
    // policy checkpoint beside an ordinary value evaluator. Both produce the same canonical arm
    // probabilities here, so the search below stays one implementation for every brain type.
    const policyPrediction = (model && model.dual) ? nnDualPredictGame(nnFeaturesGame(), model)
                           : policyModel ? nnPolicyPredictGame(nnFeaturesGame(), policyModel) : null;
    if (policyPrediction) {
        const frame = nnMoveFrame(), arms = policyPrediction.arms;
        const armKey = a => a.pv*2 + (a.dir > 0 ? 1 : 0);
        const score = new Map();
        for (let ai = 0; ai < arms.length; ai++) {
            const slot = ai >> 1, canonDir = (ai & 1) === 0 ? 1 : -1;
            score.set(frame.order[slot]*2 + ((canonDir*frame.mirror) > 0 ? 1 : 0), arms[ai]);
        }
        armList.sort((a, b) => (score.get(armKey(b)) || 0) - (score.get(armKey(a)) || 0));
    }
'''
          exact(old_arm, new_arm, label='policy arm ordering')

          exact("function nnPlanForGameTimed(idx, temperature, timeMs, model, keepForDepth) {",
                "function nnPlanForGameTimed(idx, temperature, timeMs, model, keepForDepth, policyModel) {",
                label='timed signature')
          exact("        const plan = nnPlanForGame(idx, temperature, depth, keepForDepth, model);",
                "        const plan = nnPlanForGame(idx, temperature, depth, keepForDepth, model, policyModel);",
                label='timed policy propagation')

          # Lab state carries the paired policy separately from the value evaluator.
          exact("model: null, name: ''", "model: null, policy: null, name: ''", expected=2, label='lab brain policy slots')
          old_lab_make = '''function labMakeBrainFn(side) {
    const b = labBrains[side];
    if (b.model) return idx => b.dynamic ? nnPlanForGameTimed(idx, b.temperature, b.timeMs, b.model)
                                          : nnPlanForGame(idx, b.temperature, b.depth, 4, b.model);
    return idx => ladderPlanFor(b.level, idx);
}'''
          new_lab_make = '''function labMakeBrainFn(side) {
    const b = labBrains[side];
    if (b.model) return idx => b.dynamic ? nnPlanForGameTimed(idx, b.temperature, b.timeMs, b.model, 4, b.policy)
                                          : nnPlanForGame(idx, b.temperature, b.depth, 4, b.model, b.policy);
    return idx => ladderPlanFor(b.level, idx);
}'''
          exact(old_lab_make, new_lab_make, label='lab brain policy execution')
          exact("            nnModel = b.model; nnModelName = b.name;",
                "            nnModel = b.model; nnPolicyModel = b.policy || null; nnModelName = b.name;",
                label='live human-v-policy wiring')
          exact("    else { row.classList.remove('on'); labBrains[side].model = null; if (val !== 'human') labBrains[side].level = +val; }",
                "    else { row.classList.remove('on'); labBrains[side].model = null; labBrains[side].policy = null; if (val !== 'human') labBrains[side].level = +val; }",
                label='lab policy clear')

          exact('class="labFile" type="file" accept="application/json,.json" style="display:none;"',
                'class="labFile" type="file" accept="application/json,.json" multiple style="display:none;"',
                expected=2, label='multi-file policy bundles')

          handler_re = re.compile(r"        el\.querySelector\('\.labFile'\)\.addEventListener\('change', e => \{\n.*?            reader\.readAsText\(file\);\n        \}\);", re.S)
          matches = list(handler_re.finditer(s))
          if len(matches) != 1:
              raise SystemExit(f'lab file handler: expected 1 match, found {len(matches)}')
          new_handler = r'''        el.querySelector('.labFile').addEventListener('change', async e => {
            const files = Array.from(e.target.files || []); if (!files.length) return;
            nameEl.textContent = 'Loading…';
            const leaf = q => String(q || '').replace(/\\/g, '/').split('/').pop();
            const parsed = [], byName = new Map(files.map(f => [f.name, f]));
            try {
                for (const file of files) parsed.push({ file, json: JSON.parse(await file.text()) });
            } catch (err) {
                nameEl.textContent = 'Could not parse one of those files as JSON.'; return;
            }
            const parsedByName = new Map(parsed.map(x => [x.file.name, x.json]));
            const loadNamed = async q => {
                const name = leaf(q);
                if (parsedByName.has(name)) return parsedByName.get(name);
                const url = new URL('nn/models/' + encodeURIComponent(name), location.href);
                const r = await fetch(url, { cache:'no-store' });
                if (!r.ok) throw new Error(`${name} is not on the live site (${r.status})`);
                return await r.json();
            };
            const dualOut = 1 + NN_ARMS + NN_BINS, jointOut = 3*NN_BINS*2;
            const usableValue = m => !!(m && Array.isArray(m.sizes) && Array.isArray(m.W) && Array.isArray(m.b) &&
                !m.policy && m.sizes[0] === NN_N_FEATURES && (m.dual ? m.sizes[m.sizes.length-1] === dualOut
                                                                    : m.sizes[m.sizes.length-1] === 1));
            const usablePolicy = m => {
                if (!(m && m.policy && Array.isArray(m.sizes) && Array.isArray(m.W) && Array.isArray(m.b) &&
                      m.sizes[0] === NN_N_FEATURES)) return false;
                const out = m.sizes[m.sizes.length-1];
                if (out !== NN_ARMS + NN_BINS && out !== jointOut) return false;
                const kind = m.topology && m.topology.kind;
                return !kind || kind === 'dense-memory-v1' || kind === 'pairwise-memory-v1';
            };

            // If a bundle was selected, a descriptor wins; otherwise a policy wins over a value file
            // so selecting policy+value together does the useful thing regardless of file-ordering.
            const primary = parsed.find(x => x.json && x.json.policyEntrant) ||
                            parsed.find(x => x.json && x.json.policy) || parsed[0];
            let valueModel = null, policyModel = null, label = primary.file.name, valueLabel = '';
            try {
                const j = primary.json;
                if (j && j.policyEntrant) {
                    if (!j.valueFile || !j.policyFile) throw new Error('policy entrant is missing valueFile/policyFile');
                    valueModel = await loadNamed(j.valueFile);
                    policyModel = await loadNamed(j.policyFile);
                    label = j.label || primary.file.name.replace(/\.json$/i, '');
                    valueLabel = leaf(j.valueFile);
                } else if (j && j.policy) {
                    policyModel = j;
                    const localValue = parsed.find(x => x !== primary && usableValue(x.json));
                    if (localValue) { valueModel = localValue.json; valueLabel = localValue.file.name; }
                    else {
                        // Joint policy experiments have one explicit frozen evaluator by design.
                        // Legacy 22-output policies predate that descriptor convention, so use the
                        // current best value net unless the user selected a value file beside it.
                        const out = j.sizes && j.sizes[j.sizes.length-1];
                        const base = out === jointOut ? 'policy-joint-base.json' : 'best.json';
                        valueModel = await loadNamed(base); valueLabel = base;
                    }
                } else valueModel = j;
            } catch (err) {
                nameEl.textContent = `Could not load policy dependencies: ${err.message}. Select the descriptor/value/policy JSONs together if they are not committed yet.`;
                return;
            }

            if (!usableValue(valueModel)) {
                const got = valueModel && valueModel.sizes ? valueModel.sizes[valueModel.sizes.length-1] : '?';
                nameEl.textContent = `That value model is not playable here (output ${got}; expected 1, or ${dualOut} for a dual net).`;
                return;
            }
            if (policyModel && !usablePolicy(policyModel)) {
                const got = policyModel && policyModel.sizes ? policyModel.sizes[policyModel.sizes.length-1] : '?';
                nameEl.textContent = `That policy model is not a supported Tau policy (output ${got}; expected ${NN_ARMS + NN_BINS} or ${jointOut}).`;
                return;
            }

            labBrains[side].model = valueModel;
            labBrains[side].policy = policyModel;
            labBrains[side].name = label;
            if (policyModel) nameEl.textContent = `${label} (value ${valueLabel} + policy) ✓`;
            else nameEl.textContent = primary.file.name + (valueModel.dual ? ' (dual value+policy) ✓' : ' ✓');
            e.target.value = '';
        });'''
          s = handler_re.sub(lambda m: new_handler, s, count=1)

          p.write_text(s, encoding='utf-8')
          PY

          # Parse the largest ordinary inline script (the game script) as JavaScript. This catches
          # syntax damage in the monolithic page without attempting to execute browser APIs in Node.
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>', s, re.S|re.I):
              attrs, body=m.group(1),m.group(2)
              if 'application/ld+json' not in attrs.lower(): scripts.append(body)
          if not scripts: raise SystemExit('no game script found')
          main=max(scripts,key=len)
          Path('/tmp/tau-main.js').write_text(main,encoding='utf-8')
          print('main script bytes',len(main.encode()))
          PY
          node --check /tmp/tau-main.js
          grep -q "function nnPolicyPredictGame" index.html
          grep -q "policyEntrant" index.html
          grep -q "pairwise-memory-v1" index.html

      - name: Commit Lab support
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'lab: play separate and joint policy models'
          git pull --rebase origin claude/board-game-video-adaptation-cf8a93
          git push origin HEAD:claude/board-game-video-adaptation-cf8a93
